<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phonema Lab Health</title><style>html,body{margin:0;background:#050609;color:#d7d9de;font-family:ui-monospace,monospace}main{max-width:860px;margin:auto;padding:24px}.row{display:grid;grid-template-columns:90px 1fr 90px;gap:12px;padding:10px 0;border-bottom:1px solid #1b1e24}.ok{color:#53d6b1}.bad{color:#ff5b8a}.muted{color:#6f7580}a{color:#9ec8d6}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:24px}.pill{border:1px solid #272b33;border-radius:99px;padding:8px 10px;color:#8d95a4;text-decoration:none}</style></head><body><main><div class="top"><div><div class="muted">PHONEMA LAB</div><h1>Runtime Health</h1></div><a class="pill" href="../index.html">BACK</a></div><div id="summary" class="muted">checking…</div><div id="rows"></div><script>(()=>{const rows=document.getElementById('rows'),summary=document.getElementById('summary');async function check(){let manifest;try{manifest=await fetch('../explorations/manifest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('manifest '+r.status);return r.json()})}catch(e){summary.className='bad';summary.textContent='MANIFEST ERROR · '+e.message;return}let pass=0,fail=0;for(const item of manifest.explorations){let status='OK',detail='published + syntax',cls='ok';try{const r=await fetch('../explorations/'+item.path+'?health='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const text=await r.text(),doc=new DOMParser().parseFromString(text,'text/html'),scripts=[...doc.querySelectorAll('script:not([src])')];for(const s of scripts){new Function(s.textContent)}pass++}catch(e){status='FAIL';detail=e.message;cls='bad';fail++}const el=document.createElement('div');el.className='row';el.innerHTML=`<div>${item.id}</div><div><a href="../explorations/${item.path}">${item.title}</a><div class="muted">${detail}</div></div><div class="${cls}">${status}</div>`;rows.appendChild(el)}summary.className=fail?'bad':'ok';summary.textContent=`${pass} PASS · ${fail} FAIL · manifest ${manifest.version}`;}check()})();</script></main></body></html>
