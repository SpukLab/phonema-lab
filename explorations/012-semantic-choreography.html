<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>012 — Semantic Choreography</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#101116;color:#eee;overflow:hidden;font:11px system-ui}canvas{display:block;width:100%;height:100%}.controls{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;align-items:center;gap:12px;padding:10px 14px;background:#111b;border:1px solid #fff3;border-radius:10px;backdrop-filter:blur(12px)}button{background:transparent;border:0;color:#fff;font:inherit;cursor:pointer}input{min-width:0;flex:1;accent-color:#fff}#time{font-variant-numeric:tabular-nums;white-space:nowrap}.label{position:fixed;left:14px;top:max(14px,env(safe-area-inset-top));font:10px monospace;letter-spacing:.12em;color:#777;pointer-events:none}</style></head><body><canvas id="c"></canvas><div class="label">012 / SEMANTIC CHOREOGRAPHY · STUDY 01</div><div class="controls"><button id="play" aria-label="Pausar">PAUSE</button><input id="seek" aria-label="Tiempo" type="range" min="0" max="15" step=".01" value="0"><span id="time">00.0 / 15</span><button id="full" aria-label="Pantalla completa">FULL</button></div>
<script>
(()=>{'use strict';
const c=document.getElementById('c'),g=c.getContext('2d'),seek=document.getElementById('seek'),play=document.getElementById('play'),time=document.getElementById('time');
const T=15,clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),mix=(a,b,q)=>a+(b-a)*q, smooth=x=>{x=clamp(x);return x*x*(3-2*x)},gate=(t,a,b)=>smooth((t-a)/(b-a)),TAU=Math.PI*2;
let W=0,H=0,D=1,now=0,last=null,paused=false;const letters='PHONEMA'.split(''),palette=['#892a39','#d7dfeb','#22232d','#ef533f','#e6e1d8','#526172','#242a34'];
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,1.6);c.width=Math.round(W*D);c.height=Math.round(H*D);g.setTransform(D,0,0,D,0,0)}
addEventListener('resize',resize);resize();
function glyph(ch,x,y,size,angle,fold,depth,color,opacity){g.save();g.translate(x,y);g.rotate(angle);g.transform(Math.cos(fold)*.86+.14,Math.sin(fold)*.15,-Math.sin(fold)*.25,1,0,0);g.textAlign='center';g.textBaseline='middle';g.font='900 '+size+'px Arial, Helvetica, sans-serif';g.globalAlpha=opacity;
const dx=Math.sin(fold+.6)*depth,dy=-Math.cos(fold+.6)*depth;
for(let j=18;j>0;j--){const p=j/18;g.fillStyle=j%3===0?'#424752':'#707780';g.fillText(ch,dx*p,dy*p)}
g.fillStyle=color;g.fillText(ch,0,0);g.restore()}
function render(t){const S=Math.min(W,H),u=gate(t,0,2.1),cohere=gate(t,2.2,5.6),rupture=gate(t,7.1,9.5),after=gate(t,11.4,14.2),exit=gate(t,14,15),vis=u*(1-exit);
g.globalAlpha=1;g.globalCompositeOperation='source-over';const bg=g.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#d6e3ef');bg.addColorStop(.56,'#a2b5ca');bg.addColorStop(1,'#737f94');g.fillStyle='#111216';g.fillRect(0,0,W,H);g.globalAlpha=vis;g.fillStyle=bg;g.fillRect(0,0,W,H);
const ox=W*.5,oy=H*.47,span=Math.min(W*.78,S*1.04),base=span/5.5;
g.save();g.globalAlpha=.26*vis;g.strokeStyle='#222b3b';g.lineWidth=1;g.beginPath();g.moveTo(W*.08,H*.74);g.lineTo(W*.92,H*.74);g.stroke();g.restore();
const entries=letters.map((ch,i)=>{const p=i/6,a=i*2.399+t*.22,assemble=gate(t,1.1+i*.19,4.3+i*.18),burst=rupture*(1-after),j=1-assemble,returning=after*.52;return {ch,i, z:Math.sin(a)*j+Math.cos(a)*burst,x:ox+(p-.5)*span*assemble+Math.cos(a)*S*(.43*j+.58*burst)*(1-returning),y:oy+Math.sin(a)*S*(.32*j+.39*burst)*(1-returning)+Math.sin(t*.7+i)*S*.018,size:base*(1+j*.95+burst*(.35+i%3*.33))*(1-after*.6),angle:(Math.sin(a)*j+burst*Math.cos(a)*.95)*(1-after),fold:(Math.sin(t*.8+i*1.3)*(.14+j+burst*1.5)),depth:S*(.024+.06*j+.045*burst),color:palette[i]}}).sort((a,b)=>a.z-b.z);
for(const o of entries)glyph(o.ch,o.x,o.y,o.size,o.angle,o.fold,o.depth,o.color,vis*(1-after*.45));
const q=gate(t,4.6,5.7)*(1-gate(t,8.6,9.2))*vis;
g.save();g.globalAlpha=q;const bx=ox+Math.sin(t*1.7)*S*.10,by=oy-S*.11-Math.abs(Math.sin(t*2.6))*S*.09,r=S*.042;const ball=g.createRadialGradient(bx-r*.32,by-r*.35,0,bx,by,r);ball.addColorStop(0,'#fff0d9');ball.addColorStop(.34,'#ff6348');ball.addColorStop(1,'#b21e32');g.fillStyle=ball;g.beginPath();g.arc(bx,by,r,0,TAU);g.fill();g.restore();
g.save();g.globalAlpha=rupture*(1-after)*vis*.55;g.strokeStyle='#d9e1e9';g.lineWidth=1;for(let i=0;i<34;i++){const a=i*2.399,rr=S*(.12+(i%11)*.045)*rupture;const x=ox+Math.cos(a)*rr,y=oy+Math.sin(a)*rr*.65;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*S*.04,y+Math.sin(a)*S*.04);g.stroke()}g.restore();
g.globalAlpha=1;seek.value=t;time.textContent=t.toFixed(1).padStart(4,'0')+' / 15';
}
function frame(ts){if(last!==null&&!paused)now=(now+Math.min((ts-last)/1000,.1))%T;last=ts;render(now);requestAnimationFrame(frame)}
play.addEventListener('click',()=>{paused=!paused;play.textContent=paused?'PLAY':'PAUSE';play.setAttribute('aria-label',paused?'Reproducir':'Pausar')});seek.addEventListener('input',()=>{now=Number(seek.value);paused=true;play.textContent='PLAY';play.setAttribute('aria-label','Reproducir');render(now)});document.getElementById('full').addEventListener('click',()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.()});requestAnimationFrame(frame);
})();
</script></body></html>
