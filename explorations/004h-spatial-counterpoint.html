<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#040407"><title>Phonema 004.3.3 — Spatial Counterpoint</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#040407}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.ui{position:fixed;z-index:9;right:12px;top:max(12px,env(safe-area-inset-top));display:flex;gap:6px;opacity:.2}.ui:hover{opacity:.9}.ui a,.ui button{border:1px solid #ffffff18;background:#08090bcc;color:#999;border-radius:99px;padding:9px 11px;font:9px ui-monospace,monospace;letter-spacing:.12em;text-decoration:none}.label{position:fixed;left:17px;bottom:17px;color:#3c3e47;font:9px ui-monospace,monospace;letter-spacing:.16em}</style></head><body><canvas id="c"></canvas><nav class="ui"><a href="../index.html">BACK</a><button id="capture">CAPTURE</button><button onclick="location.reload()">RESTART</button></nav><div class="label">004.3.3 · SPATIAL COUNTERPOINT</div><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D,last=performance.now(),T=0,beat=0,cam={x:0,y:0,z:1,tx:0,ty:0,tz:1},kick=0;const corpus=['DESDE QUE NACISTE','CAMINASTE','JAMÁS TE DETUVISTE A PENSAR','SOBRE OTROS DESCARGASTE','TUS TÍTERES CONTROLAR','POLÍTICA · PSICOLOGÍA · RELIGIÓN','A QUIÉN HOY PUEDES ESCUCHAR','DESBORDADO DE ESTÍMULOS','HACIA DÓNDE MIRAR','CEGADO DE CONOCIMIENTO','INMUTABLE','PEQUEÑOS HECHOS','LA CANCIÓN DEL OPRIMIDO','SAQUEANDO Y TOMANDO','IMPUNIDAD','CONTRADICCIÓN','ARMONÍA'];const col=['#eee9df','#75c9c5','#d45297','#e1a24d','#74749c'];const R=(a,b=0)=>b+Math.random()*(a-b),C=(v,a,b)=>Math.max(a,Math.min(b,v)),E=v=>v*v*(3-2*v),glyph='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/\\|—+×';function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();function mutate(s,a){return [...s].map(ch=>(ch===' '||Math.random()>a)?ch:glyph[(Math.random()*glyph.length)|0]).join('')}
const planes=Array.from({length:18},(_,i)=>({s:corpus[i%corpus.length],x:R(1.9,-1.9),y:R(1,-1),z:R(5,.32),size:R(62,12),a:R(.7,.13),rot:R(.06,-.06),phase:R(6.28),speed:R(.12,.015),color:col[i%5],font:i%5===0?'Georgia':i%4===0?'ui-monospace':'Helvetica Neue',weight:i%3?500:750}));function P(o){let z=Math.max(.12,o.z/cam.z),f=1.08/z;return{x:W/2+(o.x-cam.x)*W*f*.58,y:H/2+(o.y-cam.y)*H*f*.72,s:f,z}}
function bg(){x.fillStyle='rgba(4,4,7,.30)';x.fillRect(0,0,W,H);let q=x.createRadialGradient(W*(.42+.1*Math.sin(T*.031)),H*.47,0,W*.5,H*.5,Math.max(W,H)*.8);q.addColorStop(0,'rgba(30,35,42,.18)');q.addColorStop(.7,'rgba(8,8,12,.08)');q.addColorStop(1,'rgba(0,0,0,.6)');x.fillStyle=q;x.fillRect(0,0,W,H);if((beat%6)===4){x.globalAlpha=.07;x.fillStyle=col[(beat+1)%5];x.fillRect(0,H*.13,W,H*.025);x.fillRect(W*.18,0,W*.012,H);x.globalAlpha=1}}
function space(){[...planes].sort((a,b)=>b.z-a.z).forEach((o,i)=>{let p=P(o),sz=o.size*p.s;if(sz<3||sz>700)return;let energetic=((beat+i)%11===0),dx=Math.sin(T*o.speed+o.phase)*(energetic?32:5)/Math.max(.3,p.z),dy=Math.cos(T*o.speed*.63+o.phase)*3;let m=energetic?.16:.015;x.save();x.translate(p.x+dx,p.y+dy);x.rotate(o.rot);x.globalAlpha=C(o.a*(1.2-p.z*.1),.02,.72);x.fillStyle=o.color;x.textAlign='center';x.textBaseline='middle';x.font=`${o.weight} ${sz}px ${o.font}`;x.fillText(mutate(o.s,m),0,0);x.restore()})}
// 004.3 DNA: nervous ribbons exist, but only as short contrapuntal attacks.
function ribbons(){let l=(T+2)%17;if(l<3.1){let life=Math.min(C(l/.35,0,1),C((3.1-l)/.55,0,1)),n=l<1.25?3:1;for(let j=0;j<n;j++){let y=H*(.22+j*.18+(beat%3)*.035),dir=j%2?1:-1,speed=(j===0?1.8:.8),xx=dir>0?W*(-.35+l*speed*.42):W*(1.35-l*speed*.42);x.save();x.translate(xx,y);x.rotate((j-1)*.012);x.globalAlpha=.7*life;let gr=x.createLinearGradient(-W*.4,0,W*.4,0);gr.addColorStop(0,col[(beat+j)%5]);gr.addColorStop(.55,col[(beat+j+2)%5]);gr.addColorStop(1,col[(beat+j+3)%5]);x.fillStyle=gr;x.fillRect(-W*.52,-H*.034,W*1.04,H*.068);x.globalCompositeOperation='destination-out';x.font=`700 ${Math.max(18,H*.038)}px Helvetica Neue`;x.textAlign='center';x.textBaseline='middle';x.fillText(mutate(corpus[(beat+j)%corpus.length],.11+j*.05),0,0);x.restore()}}}
function nearPlane(){let l=(T+8)%29;if(l<8.5){let q=E(C(l/2.4,0,1)),fade=C((8.5-l)/1.5,0,1),word=corpus[(beat+9)%corpus.length].split(' ')[0];x.save();x.translate(W*(-.25+.3*q),H*.84);x.rotate(-.028);x.globalAlpha=.82*fade;x.fillStyle='#e7e2d8';x.font=`750 ${Math.min(W*.33,410)}px Helvetica Neue`;x.fillText(mutate(word,l<.8?.2:0),0,0);x.restore()}}
function fragments(){let l=(T+5)%23;if(l<1.7){let k=l/1.7,src=corpus[(beat+4)%corpus.length].replace(/ /g,'').slice(0,18);[...src].forEach((ch,i)=>{let a=i*2.1+beat,r=(20+210*E(k))*(.25+(i%6)/6);x.save();x.translate(W*.52+Math.cos(a)*r,H*.47+Math.sin(a*.8)*r*.48);x.rotate(Math.sin(a)*k);x.globalAlpha=(1-k)*.9;x.fillStyle=col[(i+beat)%5];x.font=`${i%4?500:800} ${14+(i%5)*9}px Helvetica Neue`;x.fillText(Math.random()<.18?glyph[(Math.random()*glyph.length)|0]:ch,0,0);x.restore()})}}
function flash(){let l=(T+11)%41;if(l<.55){let k=Math.sin(l/.55*Math.PI);x.fillStyle=`rgba(${beat%2?'212,70,145':'75,198,195'},${.17*k})`;x.fillRect(0,0,W,H)}}
function loop(now){let dt=Math.min(45,now-last)/1000;last=now;T+=dt;let b=Math.floor(T/7);if(b!==beat){beat=b;if(beat%2===0){cam.tx=R(.32,-.32);cam.ty=R(.15,-.15);cam.tz=R(1.7,.68)}if(beat%7===5){cam.x=R(.4,-.4);cam.y=R(.18,-.18);cam.z=R(1.5,.75)}}let k=.003*(kick?5:1);cam.x+=(cam.tx-cam.x)*k*dt*60;cam.y+=(cam.ty-cam.y)*k*dt*60;cam.z+=(cam.tz-cam.z)*k*dt*60;kick*=.94;bg();space();ribbons();fragments();nearPlane();flash();requestAnimationFrame(loop)}requestAnimationFrame(loop);c.addEventListener('pointerdown',e=>{kick=1;cam.tx+=(e.clientX/W-.5)*.25;cam.ty+=(e.clientY/H-.5)*.16;if(Math.random()<.5)T+=R(4,.8)});document.getElementById('capture').onclick=()=>c.toBlob(async b=>{let f=new File([b],`phonema-004-3-3-${Date.now()}.png`,{type:'image/png'});try{if(navigator.canShare?.({files:[f]})){await navigator.share({files:[f]});return}}catch(e){}let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click()},'image/png',1)})();</script></body></html>
