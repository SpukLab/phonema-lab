<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#040407"><title>Phonema 004.3.5 — Behavioral Cinematography</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#040407}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.ui{position:fixed;z-index:9;right:12px;top:max(12px,env(safe-area-inset-top));display:flex;gap:6px;opacity:.2}.ui:hover{opacity:.9}.ui a,.ui button{border:1px solid #ffffff18;background:#08090bcc;color:#999;border-radius:99px;padding:9px 11px;font:9px ui-monospace,monospace;letter-spacing:.12em;text-decoration:none}.label{position:fixed;left:17px;bottom:17px;color:#3c3e47;font:9px ui-monospace,monospace;letter-spacing:.16em}</style></head><body><canvas id="c"></canvas><nav class="ui"><a href="../index.html">BACK</a><button id="capture">CAPTURE</button><button onclick="location.reload()">RESTART</button></nav><div class="label">004.3.5 · BEHAVIORAL CINEMATOGRAPHY</div><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D,last=performance.now(),T=0,shot=-1,cam={x:0,y:0,z:1,tx:0,ty:0,tz:1,roll:0,troll:0},light={x:.45,y:.4,tx:.45,ty:.4,int:.4,tint:0};const R=(a,b=0)=>b+Math.random()*(a-b),C=(v,a,b)=>Math.max(a,Math.min(b,v)),E=v=>v*v*(3-2*v),glyph='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/\\|—+×';const colors=['#eee9df','#78c8c4','#d55298','#e0a14d','#74749c'];const corpus=['DESDE QUE NACISTE','CAMINASTE','JAMÁS TE DETUVISTE A PENSAR','SOBRE OTROS DESCARGASTE','TUS TÍTERES CONTROLAR','POLÍTICA · PSICOLOGÍA · RELIGIÓN','A QUIÉN HOY PUEDES ESCUCHAR','DESBORDADO DE ESTÍMULOS','HACIA DÓNDE MIRAR','CEGADO DE CONOCIMIENTO','INMUTABLE','PEQUEÑOS HECHOS','LA CANCIÓN DEL OPRIMIDO','SAQUEANDO Y TOMANDO','IMPUNIDAD','CONTRADICCIÓN','ARMONÍA'];function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();function mut(s,a){return [...s].map(ch=>(ch===' '||Math.random()>a)?ch:glyph[(Math.random()*glyph.length)|0]).join('')}
const anchors=[{s:'CEGADO',x:-.58,y:-.28,z:.82,size:62,color:1,phase:0,mode:0},{s:'OPRIMIDO',x:.48,y:-.06,z:1.35,size:54,color:0,phase:4.8,mode:1},{s:'IMPUNIDAD',x:-.28,y:.38,z:.64,size:70,color:2,phase:9.1,mode:2},{s:'CONTRADICCIÓN',x:.58,y:.45,z:2.05,size:46,color:3,phase:13.7,mode:3}];const lines=Array.from({length:14},(_,i)=>({x:R(1,-1),y:R(.8,-.8),z:R(3.8,.5),len:R(.48,.06),ang:R(.7,-.7),phase:R(6.2),tone:i%5}));function P(o,z=0){let zz=Math.max(.12,(o.z+z)/cam.z),f=1.12/zz;return{x:W/2+(o.x-cam.x)*W*f*.58,y:H/2+(o.y-cam.y)*H*f*.72,s:f,z:zz}}
function background(){x.fillStyle='rgba(4,4,7,.24)';x.fillRect(0,0,W,H);let lx=W*light.x,ly=H*light.y,r=Math.max(W,H)*(.42+.18*light.int),q=x.createRadialGradient(lx,ly,0,lx,ly,r);q.addColorStop(0,light.tint%2?'rgba(95,48,82,.24)':'rgba(52,82,87,.23)');q.addColorStop(.45,'rgba(24,27,34,.12)');q.addColorStop(1,'rgba(0,0,0,.55)');x.fillStyle=q;x.fillRect(0,0,W,H);let vg=x.createRadialGradient(W/2,H/2,Math.min(W,H)*.18,W/2,H/2,Math.max(W,H)*.72);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.45)');x.fillStyle=vg;x.fillRect(0,0,W,H)}
function anchor(o,i){let cyc=(T+o.phase)%24,p=P(o),sz=o.size*p.s,active=cyc>8&&cyc<12,k=active?(cyc-8)/4:0,w=active?Math.sin(k*Math.PI):0,text=mut(o.s,.13*w),dx=0,dy=0,rot=0,sx=1,sy=1;if(active){if(o.mode===0){sx=1+2.8*E(Math.min(1,k*1.7));sy=1+.25*w;dx=-W*.05*w}if(o.mode===1){sy=1+3.2*w;sx=.8+.25*w;dy=-H*.08*w}if(o.mode===2){sx=1+5*w;sy=.55+.45*(1-w);rot=.04*w}if(o.mode===3){let pulse=Math.sin(k*Math.PI*4)*w;sx=1+1.8*Math.abs(pulse);sy=1+.3*pulse;rot=-.22*w}}x.save();x.translate(p.x+dx,p.y+dy);x.rotate(rot);x.scale(sx,sy);x.globalAlpha=.64;x.fillStyle=colors[o.color];x.textAlign='center';x.textBaseline='middle';x.font=`${i===3?500:720} ${sz}px ${i===3?'Georgia':'Helvetica Neue'}`;x.fillText(text,0,0);x.restore();if(active&&w>.15){x.save();x.beginPath();x.rect(0,0,W,H);x.clip();for(let j=1;j<4;j++){let pp=P(o,j*.3);x.globalAlpha=.055*w*(4-j);x.fillStyle=colors[(o.color+j)%5];x.font=`650 ${o.size*pp.s*(1+j*.35*w)}px Helvetica Neue`;x.textAlign='center';x.fillText(mut(o.s,.05*j*w),pp.x,pp.y)}x.restore()}}
function graphicLines(){let local=(T+5)%18,life=local<6?Math.sin(local/6*Math.PI):0;for(let l of lines){let p=P(l),len=W*l.len*p.s,move=Math.sin(T*.25+l.phase)*28*life/p.z;x.save();x.translate(p.x+move,p.y);x.rotate(l.ang+Math.sin(T*.08+l.phase)*.12*life);x.globalAlpha=.035+.16*life;x.strokeStyle=colors[l.tone];x.lineWidth=l.z<1?2:1;x.beginPath();x.moveTo(-len/2,0);x.lineTo(len/2,0);x.stroke();if(life>.55&&Math.random()<.025){x.globalAlpha=.35;x.fillStyle=colors[(l.tone+2)%5];x.fillRect(-2,-2,4,4)}x.restore()}}
function perspectivePhrase(){let local=(T+2)%30;if(local>13)return;let q=local/13,hold=Math.sin(q*Math.PI),phrase=corpus[(shot+6)%corpus.length],y=H*(.12+.72*q),cx=W*(.92-.58*q),angle=-.72+.64*q,scale=.16+1.35*E(q);x.save();x.translate(cx,y);x.rotate(angle);x.transform(scale,0,-.52*(1-q),1,0,0);x.globalAlpha=.12+.66*hold;x.fillStyle=colors[(shot+1)%5];x.font=`650 ${Math.max(19,H*.047)}px Helvetica Neue`;x.textAlign='center';x.fillText(mut(phrase,q<.12?.18:0),0,0);x.restore()}
function letterFragments(){let local=(T+9)%27;if(local<3.2){let k=local/3.2,w=Math.sin(k*Math.PI),src=anchors[(shot+2)%4].s;[...src].forEach((ch,i)=>{let a=i*1.8+shot,r=(15+Math.pow(k,.7)*Math.max(W,H)*.34)*(i%3?.65:1);x.save();x.translate(W*.52+Math.cos(a)*r,H*.48+Math.sin(a*.71)*r*.46);x.rotate(a*k);x.globalAlpha=.72*w;x.fillStyle=colors[(i+shot)%5];x.font=`${i%3?500:800} ${18+(i%4)*18}px Helvetica Neue`;x.fillText(Math.random()<.2?glyph[(Math.random()*glyph.length)|0]:ch,0,0);x.restore()})}}
function ribbon(){let l=(T+7)%21;if(l<2.4){let life=Math.min(C(l/.25,0,1),C((2.4-l)/.35,0,1));x.save();x.translate(W*(-.28+l*.64),H*(.66+.08*Math.sin(shot)));x.rotate(-.02);x.globalAlpha=.7*life;let gr=x.createLinearGradient(-W*.5,0,W*.5,0);gr.addColorStop(0,colors[1]);gr.addColorStop(.52,colors[2]);gr.addColorStop(1,colors[3]);x.fillStyle=gr;x.fillRect(-W*.52,-H*.034,W*1.04,H*.068);x.globalCompositeOperation='destination-out';x.font=`700 ${Math.max(18,H*.038)}px Helvetica Neue`;x.textAlign='center';x.textBaseline='middle';x.fillText(mut(corpus[(shot+4)%corpus.length],.14),0,0);x.restore()}}
function exposure(){let l=(T+13)%39;if(l<.75){let w=Math.sin(l/.75*Math.PI);x.fillStyle=shot%2?`rgba(213,82,152,${.14*w})`:`rgba(120,200,196,${.13*w})`;x.fillRect(0,0,W,H)}}
function loop(now){let dt=Math.min(45,now-last)/1000;last=now;T+=dt;let s=Math.floor(T/10);if(s!==shot){shot=s;let mode=s%6;if(mode===0){cam.tx=-.25;cam.ty=.02;cam.tz=.72;cam.troll=-.015}else if(mode===1){cam.tx=.2;cam.ty=-.12;cam.tz=1.5;cam.troll=.018}else if(mode===2){cam.tx=.05;cam.ty=.14;cam.tz=.9;cam.troll=0}else if(mode===3){cam.x=R(.38,-.38);cam.y=R(.16,-.16);cam.z=R(1.5,.75);cam.tx=0;cam.ty=0;cam.tz=1.15}else{cam.tx=R(.28,-.28);cam.ty=R(.12,-.12);cam.tz=R(1.55,.72);cam.troll=R(.018,-.018)}light.tx=R(.8,.2);light.ty=R(.72,.2);light.int=R(.85,.3);light.tint=s}let k=.003;cam.x+=(cam.tx-cam.x)*k*dt*60;cam.y+=(cam.ty-cam.y)*k*dt*60;cam.z+=(cam.tz-cam.z)*k*dt*60;cam.roll+=(cam.troll-cam.roll)*k*dt*60;light.x+=(light.tx-light.x)*.002*dt*60;light.y+=(light.ty-light.y)*.002*dt*60;x.save();x.translate(W/2,H/2);x.rotate(cam.roll);x.translate(-W/2,-H/2);background();graphicLines();perspectivePhrase();anchors.forEach(anchor);ribbon();letterFragments();exposure();x.restore();requestAnimationFrame(loop)}requestAnimationFrame(loop);c.addEventListener('pointerdown',e=>{cam.tx+=(e.clientX/W-.5)*.28;cam.ty+=(e.clientY/H-.5)*.16;light.tx=e.clientX/W;light.ty=e.clientY/H;T+=R(2.2,.4)});document.getElementById('capture').onclick=()=>c.toBlob(async b=>{let f=new File([b],`phonema-004-3-5-${Date.now()}.png`,{type:'image/png'});try{if(navigator.canShare?.({files:[f]})){await navigator.share({files:[f]});return}}catch(e){}let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click()},'image/png',1)})();</script></body></html>
