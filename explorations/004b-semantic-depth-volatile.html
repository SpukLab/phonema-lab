><script>
(()=>{'use strict';const c=document.getElementById('c'),ctx=c.getContext('2d'),flash=document.getElementById('flash'),toast=document.getElementById('toast');let W=1,H=1,DPR=1,last=performance.now(),T=0,energy=.08,event={type:'calm',life:0,power:0,cx:.5,cy:.5},nextAuto=18+Math.random()*26,freeze=0;
const words=['VOICE','BODY','MEMORY','LIGHT','TRACE','SIGNAL','SKIN','MOUTH','RETURN','BEHIND','INSIDE','ERASE','OTHER','HERE','AGAIN','NO VOICE','REMEMBER','LOOKING','AFTER','BEFORE','LENGUA','LUZ','CUERPO','MEMORIA','OTRO','ADENTRO','FRAGMENT','TRANSLATE','UNKNOWN','BREATH','STATIC'];

function node(i){let z=rnd(.08,1.25),kind=Math.random()<.16?'giant':Math.random()<.22?'micro':'word';return{word:words[i%words.length],x:rnd(-.05,1.05),y:rnd(.05,.95),z,home:z,vz:rnd(-.00008,.00008),vx:rnd(-.000015,.000015),vy:rnd(-.000012,.000012),rot:rnd(-.18,.18),vr:rnd(-.00004,.00004),font:fonts[(Math.random()*fonts.length)|0],weight:Math.random()<.35?300:Math.random()<.55?600:900,kind,stretch:rnd(.65,1.7),alpha:rnd(.35,.95),phase:rnd(0,6.28)}}for(let i=0;i<58;i++)N.push(node(i));for(let i=0;i<5;i++)planes.push({z:rnd(.1,1.1),y:rnd(.08,.92),h:rnd(.05,.18),rot:rnd(-.04,.04),phase:rnd(0,6.28),tone:i%2});

function pointer(e){let r=c.getBoundingClientRect();trigger(undefined,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height,1)}c.addEventListener('pointerdown',pointer);

function render(ts){let dt=Math.min(40,ts-last);last=ts;T+=dt/1000;event.life*=Math.pow(.993,dt);energy*=Math.pow(.9982,dt);freeze*=Math.pow(.995,dt);if(T>nextAuto){trigger();nextAuto=T+rnd(22,48)}ctx.globalCompositeOperation='source-over';ctx.fillStyle=`rgba(3,3,6,${.20+.12*(1-energy)})`;ctx.fillRect(0,0,W,H);
for(let p of planes){let zz=p.z+Math.sin(T*.08+p.phase)*.05,scale=.7+zz*1.2,yy=(p.y-.5)*scale*H+H*.5;ctx.save();ctx.translate(W*.5,yy);ctx.rotate(p.rot+Math.sin(T*.05+p.phase)*.012);ctx.globalAlpha=.025+zz*.045+energy*.02;ctx.fillStyle=p.tone?'#82cbd0':'#d7cdbd';ctx.fillRect(-W*.62,-H*p.h*.5,W*1.24,H*p.h);ctx.restore()}
let ordered=[...N].sort((a,b)=>a.z-b.z);for(let n of ordered){let motion=1-freeze*.92;n.phase+=dt*.0003;n.x+=n.vx*dt*motion;n.y+=n.vy*dt*motion;n.z+=n.vz*dt*motion;n.rot+=n.vr*dt*motion;n.vx*=.9985;n.vy*=.9985;n.vz*=.996;n.vr*=.997;if(event.type==='cascade'&&event.life>.15)n.z+=Math.sin(n.x*18-T*4+n.phase)*.0008*dt*event.life;if(n.x<-.45)n.x=1.45;if(n.x>1.45)n.x=-.45;if(n.y<-.4)n.y=1.4;if(n.y>1.4)n.y=-.4;if(n.z<.03){n.z=.03;n.vz=Math.abs(n.vz)*.5}if(n.z>1.9){n.z=1.9;n.vz=-Math.abs(n.vz)*.5}n.z+=(n.home-n.z)*.000035*dt;let z=Math.max(.04,n.z),persp=.45+z*1.75,px=(n.x-.5)*persp*W+W*.5,py=(n.y-.5)*persp*H+H*.5,base=n.kind==='giant'?105:n.kind==='micro'?9:22,size=base*(.35+z*1.55);ctx.save();ctx.translate(px,py);ctx.rotate(n.rot);ctx.scale(n.stretch,1);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`${n.weight} ${size}px ${n.font}`;ctx.globalAlpha=cl(n.alpha*(.1+z*.55),.04,.95);ctx.fillStyle=z>1.15?'#f1eee6':z>.55?'#a9b8bb':'#4c525c';ctx.fillText(n.word,0,0);if(energy>.55&&Math.random()<.02*energy){ctx.globalAlpha=.16;ctx.fillStyle=Math.random()<.5?'#72e0df':'#df70b9';ctx.fillText(n.word,rnd(-12,12),rnd(-5,5))}ctx.restore()}
for(let i=frags.length-1;i>=0;i--){let f=frags[i];f.life-=dt*.00075;f.x+=f.vx*dt*.001;f.y+=f.vy*dt*.001;f.vx*=.995;f.vy*=.995;f.rot+=dt*.0005;let scale=.6+f.z*1.4;ctx.save();ctx.translate((f.x-.5)*scale*W+W*.5,(f.y-.5)*scale*H+H*.5);ctx.rotate(f.rot);ctx.globalAlpha=Math.max(0,f.life)*.55;ctx.fillStyle=f.z>1?'#f5eee8':'#73c7cc';ctx.font=`700 ${10+f.z*30}px ${f.font}`;ctx.fillText(f.s,0,0);ctx.restore();if(f.life<=0)frags.splice(i,1)}
if(event.life>.18){ctx.save();ctx.translate(W*.5,H*.5);let s=1+event.life*.35;ctx.scale(s,1);ctx.textAlign='center';ctx.textBaseline='middle';ctx.globalAlpha=.16+event.life*.5;ctx.fillStyle='#f1eee8';ctx.font=`900 ${Math.min(W*.13,175)}px ${fonts[(Math.floor(T)%fonts.length)]}`;let phrase=event.type==='implode'?'COME CLOSER':event.type==='freeze'?'HOLD':event.type==='rain'?'FALL THROUGH':event.type==='flip'?'OTHER SIDE':event.type==='tunnel'?'BEHIND LANGUAGE':event.type==='cascade'?'TRANSLATE ME':'LOOKING AT YOU';ctx.fillText(phrase,0,0);ctx.restore()}requestAnimationFrame(render)}requestAnimationFrame(render)})();
