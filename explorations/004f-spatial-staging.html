<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050507"><title>Phonema — 004.3.1 Spatial Staging</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050507;color:#eee;font-family:system-ui,-apple-system,"Helvetica Neue",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.ui{position:fixed;z-index:10;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;gap:7px;opacity:.22}.ui:hover,.ui:focus-within{opacity:.9}.ui a,.ui button{border:1px solid #ffffff18;background:#08090bbb;color:#92959b;border-radius:999px;padding:9px 12px;font:9px ui-monospace,monospace;letter-spacing:.13em;text-decoration:none}.label{position:fixed;z-index:9;left:18px;bottom:18px;font:9px ui-monospace,monospace;letter-spacing:.18em;color:#41434a}.toast{position:fixed;left:50%;bottom:52px;transform:translateX(-50%);font:9px ui-monospace,monospace;letter-spacing:.14em;color:#aaa;opacity:0}</style></head><body><canvas id="c"></canvas><nav class="ui"><a href="../index.html">BACK</a><button id="capture">CAPTURE</button><button id="restart">RESTART</button><button id="full">FULL</button></nav><div class="label">004.3.1 · SPATIAL STAGING</div><div id="toast" class="toast">FRAME CAPTURED</div><script>(()=>{'use strict';const c=document.getElementById('c'),x=c.getContext('2d'),toast=document.getElementById('toast');let W,H,D=1,last=performance.now(),t=0,scene=0,sceneT=0,sceneDur=13,cam={x:0,y:0,z:1,tx:0,ty:0,tz:1},touch=0;
const text=['DESDE QUE NACISTE','CAMINASTE','JAMÁS TE DETUVISTE','A PENSAR','SOBRE OTROS','DESCARGASTE','TUS TÍTERES','CONTROLAR','POLÍTICA','PSICOLOGÍA','RELIGIÓN','A QUIÉN HOY PUEDES ESCUCHAR','DESBORDADO DE ESTÍMULOS','HACIA DÓNDE MIRAR','CEGADO','DE CONOCIMIENTO','INMUTABLE','PEQUEÑOS HECHOS','LA CANCIÓN DEL OPRIMIDO','IMPUNIDAD','CONTRADICCIÓN','ARMONÍA'];const pal=['#ece8df','#91bfc0','#b25c8d','#9a7a55','#515762'];const rnd=(a,b=0)=>b+Math.random()*(a-b),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),smooth=v=>v*v*(3-2*v);
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const objects=Array.from({length:17},(_,i)=>({s:text[i%text.length],x:rnd(1.5,-1.5),y:rnd(.85,-.85),z:rnd(4.8,.5),size:rnd(48,13),a:rnd(.82,.24),rot:rnd(.05,-.05),font:i%6===0?'Georgia':i%5===0?'ui-monospace':'Helvetica Neue',weight:i%4===0?300:i%3===0?700:500,static:Math.random()<.48,color:pal[i%pal.length],phase:rnd(6.28),crop:Math.random()<.38}));
// Deliberate architectural foreground objects: letters become walls, not banners.
objects.push({s:'CEGADO',x:-.52,y:.04,z:.34,size:150,a:.76,rot:-.018,font:'Helvetica Neue',weight:700,static:true,color:'#e9e5dc',phase:1,crop:true});objects.push({s:'CONTRADICCIÓN',x:.72,y:.44,z:2.7,size:34,a:.48,rot:.012,font:'Georgia',weight:400,static:true,color:'#aeb5b2',phase:2,crop:false});
function newScene(force){scene=force??((scene+1)%5);sceneT=0;sceneDur=[15,18,11,14,20][scene];if(scene===0){cam.tx=-.18;cam.ty=.03;cam.tz=1.05}else if(scene===1){cam.tx=.24;cam.ty=-.08;cam.tz=1.38}else if(scene===2){cam.tx=-.05;cam.ty=.16;cam.tz=.78}else if(scene===3){cam.tx=.32;cam.ty=.03;cam.tz=1.7}else{cam.tx=0;cam.ty=-.05;cam.tz=.92}}
function project(o){let zz=Math.max(.12,o.z/cam.z),f=1.1/zz;return{x:W*.5+(o.x-cam.x)*W*f*.56,y:H*.5+(o.y-cam.y)*H*f*.72,scale:f,depth:zz}}
function background(){x.fillStyle='rgba(5,5,8,.28)';x.fillRect(0,0,W,H);let g=x.createRadialGradient(W*.42,H*.43,0,W*.42,H*.43,Math.max(W,H)*.75);g.addColorStop(0,'rgba(39,42,48,.12)');g.addColorStop(.55,'rgba(11,13,17,.08)');g.addColorStop(1,'rgba(0,0,0,.48)');x.fillStyle=g;x.fillRect(0,0,W,H); // remote planes
x.save();x.globalAlpha=.055;x.fillStyle=scene%2?'#788d91':'#786777';x.translate(W*.55,H*.51);x.rotate(-.025);x.fillRect(-W*.7,-H*.055,W*1.4,H*.11);x.globalAlpha=.025;x.fillStyle='#d7d1c6';x.fillRect(-W*.45,H*.18,W*.9,H*.035);x.restore()}
function drawObject(o,i){let p=project(o),sz=o.size*p.scale;if(sz<3||sz>900)return;let alpha=cl(o.a*(1.25-p.depth*.12),.025,.84); // almost no autonomous translation; motion comes from camera
let micro=o.static?0:Math.sin(t*.055+o.phase)*Math.min(7,12/p.depth);let px=p.x+micro,py=p.y+(o.static?0:Math.cos(t*.041+o.phase)*3);x.save();x.translate(px,py);x.rotate(o.rot);x.globalAlpha=alpha;x.fillStyle=o.color;x.textBaseline='middle';x.textAlign='center';x.font=`${o.weight} ${sz}px ${o.font}`;if(o.crop){let w=Math.max(sz*.9,x.measureText(o.s).width*.72);x.beginPath();x.rect(-w*.43,-sz*.62,w*.86,sz*1.24);x.clip()}x.fillText(o.s,0,0);x.restore()}
function foregroundArchitecture(){// Large near-plane fragments create occlusion and off-screen continuation.
if(scene===1||scene===4){x.save();let q=sceneT/sceneDur,settle=smooth(cl(q*2.2,0,1));x.translate(W*(-.16+.09*settle),H*.76);x.rotate(-.025);x.globalAlpha=.82;x.fillStyle='#d9d4ca';x.font=`700 ${Math.min(W*.31,390)}px Helvetica Neue`;x.fillText(scene===1?'IMPUNIDAD':'ARMONÍA',0,0);x.restore()}
if(scene===2){x.save();x.globalAlpha=.16;x.fillStyle='#9cc0bf';x.fillRect(W*.08,0,W*.19,H);x.globalAlpha=.62;x.fillStyle='#07080a';x.font=`600 ${Math.min(W*.17,210)}px Helvetica Neue`;x.translate(W*.17,H*.53);x.rotate(Math.PI/2);x.fillText('MIRAR',0,0);x.restore()}}
function focusVeil(){// depth cue: selective soft veil, not constant blur
if(scene===3){let g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,'rgba(5,5,8,.0)');g.addColorStop(.65,'rgba(5,5,8,.18)');g.addColorStop(1,'rgba(5,5,8,.58)');x.fillStyle=g;x.fillRect(0,0,W,H)}}
function render(now){let dt=Math.min(40,now-last);last=now;t+=dt/1000;sceneT+=dt/1000;touch*=Math.pow(.96,dt/16);if(sceneT>sceneDur)newScene(); // camera uses long easing, then nearly stops
let k=Math.min(1,dt*.00042*(touch?3.5:1));cam.x+=(cam.tx-cam.x)*k;cam.y+=(cam.ty-cam.y)*k;cam.z+=(cam.tz-cam.z)*k;background();let ordered=[...objects].sort((a,b)=>b.z-a.z);ordered.forEach(drawObject);foregroundArchitecture();focusVeil();requestAnimationFrame(render)}requestAnimationFrame(render);newScene(0);
c.addEventListener('pointerdown',e=>{touch=1;let r=c.getBoundingClientRect(),nx=(e.clientX-r.left)/r.width-.5,ny=(e.clientY-r.top)/r.height-.5;cam.tx+=nx*.18;cam.ty+=ny*.12;if(Math.random()<.34)newScene((scene+1)%5)});
function capture(){c.toBlob(async b=>{if(!b)return;let name=`phonema-004-3-1-${new Date().toISOString().replace(/[:.]/g,'-')}.png`,file=new File([b],name,{type:'image/png'});try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'Phonema 004.3.1 Spatial Staging'});show();return}}catch(e){if(e?.name==='AbortError')return}let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);show()},'image/png',1)}function show(){toast.style.opacity=1;setTimeout(()=>toast.style.opacity=0,900)}document.getElementById('capture').onclick=capture;document.getElementById('restart').onclick=()=>location.reload();document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen?.();})();</script></body></html>
