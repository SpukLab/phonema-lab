<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030407"><title>Phonema 004.3.7 — Observer / Elastic Time</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030407}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.ui{position:fixed;z-index:9;right:12px;top:max(12px,env(safe-area-inset-top));display:flex;gap:6px;opacity:.22}.ui:hover{opacity:.9}.ui a,.ui button{border:1px solid #ffffff18;background:#08090bcc;color:#aaa;border-radius:99px;padding:9px 11px;font:9px ui-monospace,monospace;letter-spacing:.12em;text-decoration:none}.label,.state{position:fixed;left:17px;color:#454954;font:9px ui-monospace,monospace;letter-spacing:.16em}.label{bottom:17px}.state{top:max(17px,env(safe-area-inset-top))}</style></head><body><canvas id="c"></canvas><nav class="ui"><a href="../index.html">BACK</a><button id="capture">CAPTURE</button><button onclick="location.reload()">RESTART</button></nav><div class="state" id="state">OBSERVER · SEARCHING</div><div class="label">004.3.7 · OBSERVER / ELASTIC TIME</div><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),state=document.getElementById('state');let W,H,D,last=performance.now(),realT=0,worldT=0,worldRate=1,rateTarget=1,phase=-1,focus=1,focusTarget=1;const R=(a,b=0)=>b+Math.random()*(a-b),C=(v,a,b)=>Math.max(a,Math.min(b,v)),E=v=>v*v*(3-2*v),glyph='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/\\|—+×',col=['#eee9df','#78c8c4','#d55298','#e0a14d','#74749c'];let cam={x:0,y:0,z:1,tx:0,ty:0,tz:1,roll:0,troll:0,hx:0,hy:0};const org=[{s:'CEGADO',x:-.62,y:-.3,z:.72,size:68,c:1,p:0},{s:'OPRIMIDO',x:.45,y:-.08,z:1.25,size:56,c:0,p:3},{s:'IMPUNIDAD',x:-.3,y:.38,z:.58,size:76,c:2,p:6},{s:'CONTRADICCIÓN',x:.56,y:.45,z:1.9,size:48,c:3,p:9},{s:'ARMONÍA',x:.08,y:.05,z:3.1,size:38,c:4,p:12}];const phrases=['JAMÁS TE DETUVISTE A PENSAR','A QUIÉN HOY PUEDES ESCUCHAR','DESBORDADO DE ESTÍMULOS','HACIA DÓNDE MIRAR','CEGADO DE CONOCIMIENTO','LA CANCIÓN DEL OPRIMIDO','CONVIVIENDO EN ARMONÍA'];function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();function mut(s,a){return [...s].map(ch=>(ch===' '||Math.random()>a)?ch:glyph[(Math.random()*glyph.length)|0]).join('')}function P(o,z=0){let zz=Math.max(.12,(o.z+z)/cam.z),f=1.13/zz;return{x:W/2+(o.x-cam.x+cam.hx)*W*f*.58,y:H/2+(o.y-cam.y+cam.hy)*H*f*.72,s:f,z:zz}}
function atmosphere(){x.fillStyle='rgba(3,4,7,.22)';x.fillRect(0,0,W,H);let q=x.createRadialGradient(W*.48,H*.43,0,W*.5,H*.5,Math.max(W,H)*.8);q.addColorStop(0,'rgba(38,45,53,.17)');q.addColorStop(.55,'rgba(12,14,20,.07)');q.addColorStop(1,'rgba(0,0,0,.62)');x.fillStyle=q;x.fillRect(0,0,W,H)}
function drawOrg(o,i){let p=P(o),cy=(worldT+o.p)%18,active=cy>5&&cy<8.4,k=active?(cy-5)/3.4:0,w=active?Math.sin(k*Math.PI):0,sz=o.size*p.s,blur=Math.abs(p.z-focus)*2.3;x.save();x.translate(p.x,p.y);let sx=1,sy=1,rot=0;if(active){if(i%3===0)sx=1+3*w;if(i%3===1){sy=1+2.2*w;rot=-.12*w}if(i%3===2){sx=1+4*w;sy=.65+.35*(1-w)}}x.scale(sx,sy);x.rotate(rot);x.globalAlpha=C(.68-blur*.09,.16,.68);x.fillStyle=col[o.c];x.textAlign='center';x.textBaseline='middle';x.font=`${i===3?500:720} ${sz}px ${i===3?'Georgia':'Helvetica Neue'}`;x.fillText(mut(o.s,.13*w),0,0);x.restore();if(active&&worldRate<.35){for(let j=1;j<7;j++){let a=(i*1.7+j*.9),r=(20+j*22)*w;x.save();x.translate(p.x+Math.cos(a)*r,p.y+Math.sin(a*.8)*r*.5);x.rotate(a*.2);x.globalAlpha=.1*w;x.fillStyle=col[(o.c+j)%5];x.font=`600 ${sz*(.4+j*.1)}px Helvetica Neue`;x.fillText(o.s[j%o.s.length]||'×',0,0);x.restore()}}}
function planes(){let t=(worldT+4)%24;if(t<10){let q=t/10,w=Math.sin(q*Math.PI),s=phrases[phase%phrases.length];x.save();x.translate(W*(.88-.55*q),H*(.16+.64*q));x.rotate(-.68+.58*q);x.transform(.18+1.4*E(q),0,-.5*(1-q),1,0,0);x.globalAlpha=.12+.58*w;x.fillStyle=col[(phase+1)%5];x.font=`650 ${Math.max(18,H*.045)}px Helvetica Neue`;x.textAlign='center';x.fillText(mut(s,q<.12?.15:0),0,0);x.restore()}}
function lines(){let intensity=worldRate<.4?.8:.22;for(let i=0;i<9;i++){let z=.6+i*.38,p=P({x:-.9+i*.22,y:-.62+(i%4)*.38,z}),len=W*(.08+(i%3)*.07)*p.s;x.save();x.translate(p.x,p.y);x.rotate(-.3+i*.09);x.globalAlpha=.035+intensity*.08;x.strokeStyle=col[(i+phase)%5];x.beginPath();x.moveTo(-len,0);x.lineTo(len,0);x.stroke();x.restore()}}
function timeEvent(){let local=realT%32;if(local<8){rateTarget=1;state.textContent='OBSERVER · SEARCHING'}else if(local<13){rateTarget=.075;state.textContent='OBSERVER · WORLD SLOW / CAMERA FREE'}else if(local<17){rateTarget=.22;state.textContent='OBSERVER · FOCUS DRIFT'}else if(local<20){rateTarget=2.8;state.textContent='OBSERVER · RECOVERY / ACCELERATION'}else{rateTarget=.82;state.textContent='OBSERVER · HANDHELD'}worldRate+=(rateTarget-worldRate)*.025;let hand=local>20?.0018:.00045;cam.hx=Math.sin(realT*2.7)*hand+Math.sin(realT*7.1)*hand*.35;cam.hy=Math.cos(realT*2.1)*hand*.8+Math.sin(realT*6.3)*hand*.3;if(local>13&&local<17)focusTarget=.65+2.2*(.5+.5*Math.sin(realT*.55));else focusTarget=1.05;focus+=(focusTarget-focus)*.018}
function loop(now){let dt=Math.min(45,now-last)/1000;last=now;realT+=dt;timeEvent();worldT+=dt*worldRate;let ph=Math.floor(realT/8);if(ph!==phase){phase=ph;let mode=ph%6;if(mode===0){cam.tx=-.26;cam.ty=.02;cam.tz=.72;cam.troll=-.014}else if(mode===1){cam.tx=.18;cam.ty=-.11;cam.tz=1.48;cam.troll=.012}else if(mode===2){cam.tx=.02;cam.ty=.12;cam.tz=.86;cam.troll=0}else if(mode===3){cam.x=R(.34,-.34);cam.y=R(.14,-.14);cam.z=R(1.45,.76);cam.tx=0;cam.ty=0;cam.tz=1.12}else{cam.tx=R(.27,-.27);cam.ty=R(.12,-.12);cam.tz=R(1.5,.74);cam.troll=R(.018,-.018)}}let ck=.004;cam.x+=(cam.tx-cam.x)*ck*dt*60;cam.y+=(cam.ty-cam.y)*ck*dt*60;cam.z+=(cam.tz-cam.z)*ck*dt*60;cam.roll+=(cam.troll-cam.roll)*ck*dt*60;x.save();x.translate(W/2,H/2);x.rotate(cam.roll);x.translate(-W/2,-H/2);atmosphere();lines();planes();org.slice().sort((a,b)=>b.z-a.z).forEach((o,i)=>drawOrg(o,org.indexOf(o)));if(worldRate<.12){x.fillStyle='rgba(120,200,196,.035)';x.fillRect(0,0,W,H)}x.restore();requestAnimationFrame(loop)}requestAnimationFrame(loop);c.addEventListener('pointerdown',e=>{cam.tx+=(e.clientX/W-.5)*.28;cam.ty+=(e.clientY/H-.5)*.16;realT=(Math.floor(realT/32)*32)+8.2});document.getElementById('capture').onclick=()=>c.toBlob(async b=>{let f=new File([b],`phonema-004-3-7-${Date.now()}.png`,{type:'image/png'});try{if(navigator.canShare?.({files:[f]})){await navigator.share({files:[f]});return}}catch(e){}let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click()},'image/png',1)})();</script></body></html>
