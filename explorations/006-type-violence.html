<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Phonema 006 — Type Violence</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eee9df}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.ui{position:fixed;z-index:9;right:10px;top:max(10px,env(safe-area-inset-top));display:flex;gap:5px}.ui a,.ui button{border:1px solid #1113;background:#eee9dfe8;color:#111;border-radius:99px;padding:9px 10px;font:9px ui-monospace,monospace;letter-spacing:.1em;text-decoration:none}.lab{position:fixed;left:14px;bottom:14px;color:#1116;font:9px ui-monospace,monospace;letter-spacing:.14em}</style></head><body><canvas id="c"></canvas><nav class="ui"><a href="../index.html">BACK</a><a href="../archive.html">ARCHIVE</a><button id="save">SAVE FRAME</button></nav><div class="lab">006 · TYPE VIOLENCE / GLYPH ARCHITECTURE</div><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D,t=0,last=performance.now(),epoch=-1;const words=['CONTRADICCIÓN','IMPUNIDAD','CEGADO','OPRIMIDO'];let target=0;function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();function draw(){let e=Math.floor(t/9),local=t%9;if(e!==epoch){epoch=e;target=(target+1)%words.length}x.fillStyle='#e9e2d6';x.fillRect(0,0,W,H);let word=words[target],gi=Math.floor(t/3)%word.length,glyph=word[gi]||'A';x.save();x.translate(W*.5,H*.52);x.rotate(Math.sin(t*.13)*.12);let scale=1+Math.sin(t*.21)*.18;x.scale(scale,scale);x.textAlign='center';x.textBaseline='middle';x.font=`900 ${Math.max(W,H)*.9}px Arial Black`;x.fillStyle='#101011';x.fillText(glyph,0,0);x.globalCompositeOperation='source-atop';let gr=x.createLinearGradient(-W*.5,-H*.4,W*.5,H*.4);gr.addColorStop(0,'#ba1f38');gr.addColorStop(.48,'#101011');gr.addColorStop(.52,'#2b8890');gr.addColorStop(1,'#d6a43b');x.globalAlpha=.72;x.fillStyle=gr;x.fillRect(-W,-H,W*2,H*2);x.restore();x.globalCompositeOperation='source-over';let k=Math.sin(Math.min(1,local/2)*Math.PI);for(let i=0;i<word.length;i++){let a=i/Math.max(1,word.length-1),xx=W*(.08+.84*a),yy=H*(.18+.62*((i%3)/2));x.save();x.translate(xx,yy);x.rotate((a-.5)*1.2+Math.sin(t*.4+i)*.08);let s=18+H*.04+(i===gi?H*.14*k:0);x.font=`${i%2?400:800} ${s}px ${i%3===0?'Georgia':'Arial Narrow'}`;x.fillStyle=i%4===0?'#ba1f38':i%4===1?'#101011':i%4===2?'#2b8890':'#d6a43b';x.globalAlpha=.38+.5*(i===gi);x.fillText(word[i],0,0);x.restore()}if(local>4.8&&local<6.4){let q=(local-4.8)/1.6;x.fillStyle='#101011';x.globalAlpha=.88*Math.sin(q*Math.PI);x.fillRect(0,H*(.62-.35*q),W,H*.12);x.globalCompositeOperation='destination-out';x.font=`800 ${H*.055}px Arial Narrow`;x.textAlign='center';x.fillText(word,W*.5,H*(.69-.35*q));x.globalCompositeOperation='source-over';x.globalAlpha=1}x.globalAlpha=.08;x.fillStyle='#101011';for(let i=0;i<100;i++)x.fillRect((i*73+t*11)%W,(i*131)%H,1,1);x.globalAlpha=1}function loop(n){let dt=Math.min(45,n-last)/1000;last=n;t+=dt;draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);c.addEventListener('pointerdown',()=>t=Math.floor(t/9)*9+4.9);function blob(){return new Promise(r=>c.toBlob(r,'image/png',.96))}function dbOpen(){return new Promise((res,rej)=>{let q=indexedDB.open('phonema-archive',1);q.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('captures'))d.createObjectStore('captures',{keyPath:'id'})};q.onsuccess=e=>res(e.target.result);q.onerror=rej})}document.getElementById('save').onclick=async()=>{let b=await blob(),db=await dbOpen(),id=Date.now(),tx=db.transaction('captures','readwrite');tx.objectStore('captures').put({id,blob:b,specimen:'006 · TYPE VIOLENCE',state:words[target],tag:'TYPE'});tx.oncomplete=()=>{let e=document.getElementById('save');e.textContent='SAVED ✓';setTimeout(()=>e.textContent='SAVE FRAME',900)}}})();</script>
