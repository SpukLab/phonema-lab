<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#040407"><title>Phonema 004.3.6 — Causal Ecology</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#040407}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.ui{position:fixed;z-index:9;right:12px;top:max(12px,env(safe-area-inset-top));display:flex;gap:6px;opacity:.2}.ui:hover{opacity:.9}.ui a,.ui button{border:1px solid #ffffff18;background:#08090bcc;color:#999;border-radius:99px;padding:9px 11px;font:9px ui-monospace,monospace;letter-spacing:.12em;text-decoration:none}.label{position:fixed;left:17px;bottom:17px;color:#3c3e47;font:9px ui-monospace,monospace;letter-spacing:.16em}</style></head><body><canvas id="c"></canvas><nav class="ui"><a href="../index.html">BACK</a><button id="capture">CAPTURE</button><button onclick="location.reload()">RESTART</button></nav><div class="label">004.3.6 · CAUSAL ECOLOGY</div><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D,last=performance.now(),T=0,cycle=-1,energy=0,cam={x:0,y:0,z:1,tx:0,ty:0,tz:1,roll:0},light={x:.42,y:.42,tx:.42,ty:.42,pulse:0};const R=(a,b=0)=>b+Math.random()*(a-b),C=(v,a,b)=>Math.max(a,Math.min(b,v)),E=v=>v*v*(3-2*v),glyph='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/\\|—+×';const col=['#eee9df','#78c8c4','#d55298','#e0a14d','#74749c'];const corpus=['JAMÁS TE DETUVISTE A PENSAR','A QUIÉN HOY PUEDES ESCUCHAR','DESBORDADO DE ESTÍMULOS','HACIA DÓNDE MIRAR','CEGADO DE CONOCIMIENTO','LA CANCIÓN DEL OPRIMIDO','SAQUEANDO Y TOMANDO','CONVIVIENDO EN ARMONÍA'];function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();function mut(s,a){return [...s].map(ch=>(ch===' '||Math.random()>a)?ch:glyph[(Math.random()*glyph.length)|0]).join('')}
const org=[{s:'CEGADO',x:-.58,y:-.28,z:.78,size:64,color:1},{s:'OPRIMIDO',x:.48,y:-.08,z:1.32,size:55,color:0},{s:'IMPUNIDAD',x:-.28,y:.38,z:.62,size:72,color:2},{s:'CONTRADICCIÓN',x:.58,y:.44,z:2.0,size:46,color:3}];const links=[];function P(o,z=0){let zz=Math.max(.12,(o.z+z)/cam.z),f=1.12/zz;return{x:W/2+(o.x-cam.x)*W*f*.58,y:H/2+(o.y-cam.y)*H*f*.72,s:f,z:zz}}
function bg(){x.fillStyle='rgba(4,4,7,.25)';x.fillRect(0,0,W,H);let lx=W*light.x,ly=H*light.y,r=Math.max(W,H)*(.36+.16*light.pulse),q=x.createRadialGradient(lx,ly,0,lx,ly,r);q.addColorStop(0,`rgba(${light.pulse>.45?'106,47,87':'45,79,84'},${.12+.18*light.pulse})`);q.addColorStop(.6,'rgba(18,20,27,.08)');q.addColorStop(1,'rgba(0,0,0,.58)');x.fillStyle=q;x.fillRect(0,0,W,H)}
function stateFor(i){let local=(T-i*2.15)%20;if(local<0)local+=20;let active=local>4&&local<7.2,k=active?(local-4)/3.2:0;return{local,active,k,w:active?Math.sin(k*Math.PI):0}}
function organism(o,i){let st=stateFor(i),p=P(o),sz=o.size*p.s,w=st.w,sx=1,sy=1,dx=0,dy=0,rot=0,text=o.s;if(st.active){text=mut(o.s,.16*w);if(i===0){sx=1+3.2*E(Math.min(1,st.k*1.8));dx=-W*.04*w}if(i===1){sy=1+2.7*w;dy=-H*.06*w}if(i===2){sx=1+4.3*w;sy=.62+.38*(1-w)}if(i===3){rot=-.28*w;sx=1+1.8*w}}x.save();x.translate(p.x+dx,p.y+dy);x.rotate(rot);x.scale(sx,sy);x.globalAlpha=.62;x.fillStyle=col[o.color];x.textAlign='center';x.textBaseline='middle';x.font=`${i===3?500:720} ${sz}px ${i===3?'Georgia':'Helvetica Neue'}`;x.fillText(text,0,0);x.restore();if(st.active&&st.k>.48&&st.k<.57){let j=(i+1)%4,a=P(o),b=P(org[j]);links.push({ax:a.x,ay:a.y,bx:b.x,by:b.y,birth:T,color:col[(o.color+2)%5]});light.tx=b.x/W;light.ty=b.y/H;light.pulse=1;cam.tx+=(b.x-a.x)/W*.07;cam.ty+=(b.y-a.y)/H*.05}if(st.active){for(let j=1;j<4;j++){let pp=P(o,j*.27);x.globalAlpha=.045*w*(4-j);x.fillStyle=col[(o.color+j)%5];x.font=`650 ${o.size*pp.s*(1+j*.3*w)}px Helvetica Neue`;x.textAlign='center';x.fillText(mut(o.s,.04*j*w),pp.x,pp.y)}x.globalAlpha=1}}
function causalLinks(){for(let i=links.length-1;i>=0;i--){let l=links[i],age=T-l.birth;if(age>2.8){links.splice(i,1);continue}let k=C(age/.8,0,1),fade=C((2.8-age)/1.3,0,1),mx=l.ax+(l.bx-l.ax)*E(k),my=l.ay+(l.by-l.ay)*E(k);x.save();x.globalAlpha=.55*fade;x.strokeStyle=l.color;x.lineWidth=1.2;x.beginPath();x.moveTo(l.ax,l.ay);x.lineTo(mx,my);x.stroke();for(let j=0;j<5;j++){let q=C(k-j*.08,0,1);x.globalAlpha=.18*fade;x.fillStyle=col[(j+cycle)%5];x.fillRect(l.ax+(l.bx-l.ax)*q-1,l.ay+(l.by-l.ay)*q-1,2+j*.4,2+j*.4)}x.restore()}}
function phrase(){let l=(T+3)%26;if(l>11)return;let q=l/11,w=Math.sin(q*Math.PI),src=corpus[cycle%corpus.length];x.save();x.translate(W*(.91-.56*q),H*(.12+.68*q));x.rotate(-.72+.63*q);x.transform(.18+1.3*E(q),0,-.5*(1-q),1,0,0);x.globalAlpha=.1+.58*w;x.fillStyle=col[(cycle+1)%5];x.font=`650 ${Math.max(18,H*.045)}px Helvetica Neue`;x.textAlign='center';x.fillText(mut(src,q<.13?.16:0),0,0);x.restore()}
function ribbon(){let l=(T+8)%23;if(l<2.3){let life=Math.min(C(l/.24,0,1),C((2.3-l)/.38,0,1));x.save();x.translate(W*(-.3+l*.65),H*(.69+.06*Math.sin(cycle)));x.rotate(-.02);x.globalAlpha=.68*life;let gr=x.createLinearGradient(-W*.5,0,W*.5,0);gr.addColorStop(0,col[1]);gr.addColorStop(.52,col[2]);gr.addColorStop(1,col[3]);x.fillStyle=gr;x.fillRect(-W*.52,-H*.034,W*1.04,H*.068);x.globalCompositeOperation='destination-out';x.font=`700 ${Math.max(18,H*.038)}px Helvetica Neue`;x.textAlign='center';x.textBaseline='middle';x.fillText(mut(corpus[(cycle+3)%corpus.length],.14),0,0);x.restore()}}
function loop(now){let dt=Math.min(45,now-last)/1000;last=now;T+=dt;let cy=Math.floor(T/12);if(cy!==cycle){cycle=cy;cam.tx=R(.25,-.25);cam.ty=R(.12,-.12);cam.tz=R(1.55,.72);if(cy%5===4){cam.x=R(.35,-.35);cam.y=R(.15,-.15)}light.tx=R(.78,.22);light.ty=R(.72,.22)}let k=.003;cam.x+=(cam.tx-cam.x)*k*dt*60;cam.y+=(cam.ty-cam.y)*k*dt*60;cam.z+=(cam.tz-cam.z)*k*dt*60;light.x+=(light.tx-light.x)*.004*dt*60;light.y+=(light.ty-light.y)*.004*dt*60;light.pulse*=Math.pow(.975,dt*60);bg();phrase();causalLinks();org.forEach(organism);ribbon();requestAnimationFrame(loop)}requestAnimationFrame(loop);c.addEventListener('pointerdown',e=>{let nearest=0,best=1e9;org.forEach((o,i)=>{let p=P(o),d=(p.x-e.clientX)**2+(p.y-e.clientY)**2;if(d<best){best=d;nearest=i}});let a=P(org[nearest]),b=P(org[(nearest+1)%4]);links.push({ax:a.x,ay:a.y,bx:b.x,by:b.y,birth:T,color:col[(nearest+2)%5]});light.tx=b.x/W;light.ty=b.y/H;light.pulse=1;T+=1.1});document.getElementById('capture').onclick=()=>c.toBlob(async b=>{let f=new File([b],`phonema-004-3-6-${Date.now()}.png`,{type:'image/png'});try{if(navigator.canShare?.({files:[f]})){await navigator.share({files:[f]});return}}catch(e){}let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click()},'image/png',1)})();</script></body></html>
