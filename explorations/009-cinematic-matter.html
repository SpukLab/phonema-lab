function loop(now){let dt=Math.min(45,now-last)/1000;last=now;rt+=dt;timing();wt+=dt*rate;let s=Math.floor(rt/9);if(s!==shot){shot=s;if(s%4===2){cam.x=R(.4,-.4);cam.y=R(.18,-.18);cam.z=R(1.65,.62);flash=.7}else{cam.tx=R(.3,-.3);cam.ty=R(.14,-.14);cam.tz=s%5===0?R(.55,.36):R(1.5,.68);cam.troll=R(.022,-.022)}}let k=.004;cam.x+=(cam.tx-cam.x)*k*dt*60;cam.y+=(cam.ty-cam.y)*k*dt*60;cam.z+=(cam.tz-cam.z)*k*dt*60;cam.roll+=(cam.troll-cam.roll)*k*dt*60;x.save();x.translate(W/2,H/2);x.rotate(cam.roll);x.translate(-W/2,-H/2);background(dt);giantSurface();org.slice().sort((a,b)=>b.z-a.z).forEach(o=>materialWord(o,org.indexOf(o)));spectral();flare();x.restore();requestAnimationFrame(loop)}requestAnimationFrame(loop);c.addEventListener('pointerdown',e=>{cam.tx+=(e.clientX/W-.5)*.3;cam.ty+=(e.clientY/H-.5)*.16;rt=(Math.floor(rt/36)*36)+10.4;flash=.8});function blob(){return new Promise(r=>c.toBlob(r,'image/png',.96))}function dbOpen(){return new Promise((res,rej)=>{let q=indexedDB.open('phonema-archive',1);q.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('captures'))d.createObjectStore('captures',{keyPath:'id'})};q.onsuccess=e=>res(e.target.result);q.onerror=rej})}document.getElementById('save').onclick=async()=>{let b=await blob(),db=await dbOpen(),id=Date.now(),tx=db.transaction('captures','readwrite');tx.objectStore('captures').put({id,blob:b,specimen:'009 · CINEMATIC MATTER',state:state.textContent,tag:'MATERIAL'});tx.oncomplete=()=>{let e=document.getElementById('save');e.textContent='SAVED ✓';setTimeout(()=>e.textContent='SAVE FRAME',900)}})();</script></body></html>
