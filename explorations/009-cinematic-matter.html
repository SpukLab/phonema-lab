ED'}else if(l<21){target=.17;state.textContent='LENS · FOCUS HUNT'}else if(l<23.5){target=2.4;state.textContent='LENS · SNAP BACK'}else{target=.74;state.textContent='LENS · HANDHELD'}rate+=(target-rate)*.024;let h=l>23.5?.0017:.0003;cam.hx=Math.sin(rt*2.7)*h+Math.sin(rt*7.6)*h*.35;cam.hy=Math.cos(rt*2.1)*h*.75+Math.sin(rt*6.3)*h*.28;focus=l>17&&l<21?.55+2.2*(.5+.5*Math.sin(rt*.58)):1.05}function render(dt){background(dt);giant();let sorted=org.slice().sort((a,b)=>b.z-a.z);for(let i=0;i<sorted.length;i++)word(sorted[i],org.indexOf(sorted[i]));glitter();flareFx()}function loop(now){try{let dt=Math.min(45,now-last)/1000;last=now;rt+=dt;timing();wt+=dt*rate;let s=Math.floor(rt/9);if(s!==shot){shot=s;if(s%4===2){cam.x=rnd(.32,-.32);cam.y=rnd(.14,-.14);cam.z=rnd(1.35,.78);flash=.65}else{cam.tx=rnd(.22,-.22);cam.ty=rnd(.1,-.1);cam.tz=s%5===0?rnd(.85,.65):rnd(1.3,.8);cam.troll=rnd(.014,-.014)}}let k=.005;cam.x+=(cam.tx-cam.x)*k*dt*60;cam.y+=(cam.ty-cam.y)*k*dt*60;cam.z+=(cam.tz-cam.z)*k*dt*60;cam.roll+=(cam.troll-cam.roll)*k*dt*60;x.save();x.translate(W/2,H/2);x.rotate(cam.roll);x.translate(-W/2,-H/2);render(dt);x.restore();requestAnimationFrame(loop)}catch(e){err.textContent='RENDER ERROR · '+e.message;state.textContent='LENS · STOPPED'}}requestAnimationFrame(loop);c.addEventListener('pointerdown',e=>{cam.tx+=(e.clientX/W-.5)*.22;cam.ty+=(e.clientY/H-.5)*.12;rt=(Math.floor(rt/36)*36)+10.4;flash=.75});function blob(){return new Promise(r=>c.toBlob(r,'image/png',.92))}function dbOpen(){return new Promise((res,rej)=>{let q=indexedDB.open('phonema-archive',1);q.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('captures'))d.createObjectStore('captures',{keyPath:'id'})};q.onsuccess=e=>res(e.target.result);q.onerror=rej})}document.getElementById('save').onclick=async()=>{let b=await blob(),db=await dbOpen(),id=Date.now(),tx=db.transaction('captures','readwrite');tx.objectStore('captures').put({id,blob:b,specimen:'009 · CINEMATIC MATTER',state:state.textCo
