<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#040407"><title>Phonema 004.3.4 — Behavioral Constellation</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#040407}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.ui{position:fixed;z-index:9;right:12px;top:max(12px,env(safe-area-inset-top));display:flex;gap:6px;opacity:.2}.ui:hover{opacity:.9}.ui a,.ui button{border:1px solid #ffffff18;background:#08090bcc;color:#999;border-radius:99px;padding:9px 11px;font:9px ui-monospace,monospace;letter-spacing:.12em;text-decoration:none}.label{position:fixed;left:17px;bottom:17px;color:#3c3e47;font:9px ui-monospace,monospace;letter-spacing:.16em}</style></head><body><canvas id="c"></canvas><nav class="ui"><a href="../index.html">BACK</a><button id="capture">CAPTURE</button><button onclick="location.reload()">RESTART</button></nav><div class="label">004.3.4 · BEHAVIORAL CONSTELLATION</div><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D,last=performance.now(),T=0,epoch=-1,cam={x:0,y:0,z:1,tx:0,ty:0,tz:1};const R=(a,b=0)=>b+Math.random()*(a-b),C=(v,a,b)=>Math.max(a,Math.min(b,v)),E=v=>v*v*(3-2*v);const glyph='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/\\|—+×';const colors=['#eee9df','#78c8c4','#d55298','#e0a14d','#74749c'];const corpus=['DESDE QUE NACISTE','CAMINASTE','JAMÁS TE DETUVISTE A PENSAR','SOBRE OTROS DESCARGASTE','TUS TÍTERES CONTROLAR','POLÍTICA · PSICOLOGÍA · RELIGIÓN','A QUIÉN HOY PUEDES ESCUCHAR','DESBORDADO DE ESTÍMULOS','HACIA DÓNDE MIRAR','CEGADO DE CONOCIMIENTO','INMUTABLE','PEQUEÑOS HECHOS','LA CANCIÓN DEL OPRIMIDO','SAQUEANDO Y TOMANDO','IMPUNIDAD','CONTRADICCIÓN','ARMONÍA'];function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();function mut(s,a){return [...s].map(ch=>(ch===' '||Math.random()>a)?ch:glyph[(Math.random()*glyph.length)|0]).join('')}
// Four persistent semantic organisms. They do not wait passively: each owns a behavioral cycle.
const anchors=[{s:'CEGADO',x:-.62,y:-.27,z:.8,size:64,color:1,phase:0},{s:'OPRIMIDO',x:.48,y:-.06,z:1.35,size:54,color:0,phase:4.1},{s:'IMPUNIDAD',x:-.3,y:.38,z:.62,size:72,color:2,phase:8.4},{s:'CONTRADICCIÓN',x:.58,y:.46,z:2.05,size:48,color:3,phase:12.7}];function P(o,zAdd=0){let z=Math.max(.12,(o.z+zAdd)/cam.z),f=1.12/z;return{x:W/2+(o.x-cam.x)*W*f*.58,y:H/2+(o.y-cam.y)*H*f*.72,s:f,z}}
function background(){x.fillStyle='rgba(4,4,7,.28)';x.fillRect(0,0,W,H);let q=x.createRadialGradient(W*(.42+.12*Math.sin(T*.025)),H*(.45+.05*Math.cos(T*.018)),0,W*.5,H*.5,Math.max(W,H)*.82);q.addColorStop(0,'rgba(32,36,45,.18)');q.addColorStop(.68,'rgba(8,8,12,.08)');q.addColorStop(1,'rgba(0,0,0,.6)');x.fillStyle=q;x.fillRect(0,0,W,H)}
function behavior(o,i){let cycle=(T+o.phase)%22,mode=i%4,p=P(o),sz=o.size*p.s,alpha=.62,dx=0,dy=0,rot=0,scaleX=1,text=o.s,color=colors[o.color];if(cycle>8&&cycle<11.2){let k=(cycle-8)/3.2,w=Math.sin(k*Math.PI),fast=Math.sin(k*Math.PI*8);if(mode===0){dx=fast*24*w/p.z;text=mut(o.s,.18*w);scaleX=1+.18*w}if(mode===1){dy=-E(k)*H*.12;rot=.16*w;sz*=1+.35*w;text=mut(o.s,.1*w)}if(mode===2){let pulse=Math.sin(k*Math.PI*5)*w;scaleX=1+.28*pulse;dx=pulse*16;text=mut(o.s,.22*w);color=colors[(o.color+2)%5]}if(mode===3){rot=-.28*w;dx=E(k)*W*.08;sz*=1+.5*w;text=mut(o.s,.13*w)}}x.save();x.translate(p.x+dx,p.y+dy);x.rotate(rot);x.scale(scaleX,1);x.globalAlpha=alpha;x.fillStyle=color;x.textAlign='center';x.textBaseline='middle';x.font=`${i===3?500:700} ${sz}px ${i===3?'Georgia':'Helvetica Neue'}`;x.fillText(text,0,0);x.restore(); // echoes make each behavior spatial rather than merely animated
if(cycle>8.2&&cycle<10.7){let w=Math.sin((cycle-8.2)/2.5*Math.PI);for(let j=1;j<4;j++){let pp=P(o,j*.28);x.save();x.globalAlpha=.09*w*(4-j);x.fillStyle=colors[(o.color+j)%5];x.font=`600 ${o.size*pp.s}px Helvetica Neue`;x.textAlign='center';x.fillText(mut(o.s,.05*j*w),pp.x,pp.y);x.restore()}}}
// Phrase-plane leaves the frontal plane: trapezoid-like perspective by slicing and horizontal compression.
function perspectivePhrase(){let local=(T+3)%28;if(local>12)return;let q=local/12,hold=Math.sin(Math.min(1,q)*Math.PI),phrase=corpus[(Math.floor(T/28)+2)%corpus.length],y=H*(.18+.55*q),cx=W*(.82-.48*q),angle=-.62+.5*q,scale=.25+.95*q;x.save();x.translate(cx,y);x.rotate(angle);x.transform(scale,0,-.38*(1-q),1,0,0);x.globalAlpha=.16+.58*hold;x.fillStyle=colors[(Math.floor(T/28)+1)%5];x.font=`650 ${Math.max(18,H*.045)}px Helvetica Neue`;x.textAlign='center';x.fillText(mut(phrase,q<.15?.12:0),0,0);x.restore()}
// 004.3 ribbon DNA: brief and nervous, but now one organism among others.
function ribbon(){let l=(T+6)%19;if(l<2.5){let life=Math.min(C(l/.25,0,1),C((2.5-l)/.4,0,1)),y=H*(.68+.08*Math.sin(epoch));x.save();x.translate(W*(-.3+l*.58),y);x.rotate(-.018);x.globalAlpha=.72*life;let gr=x.createLinearGradient(-W*.5,0,W*.5,0);gr.addColorStop(0,colors[1]);gr.addColorStop(.55,colors[2]);gr.addColorStop(1,colors[3]);x.fillStyle=gr;x.fillRect(-W*.5,-H*.035,W,H*.07);x.globalCompositeOperation='destination-out';x.font=`700 ${Math.max(18,H*.038)}px Helvetica Neue`;x.textAlign='center';x.textBaseline='middle';x.fillText(mut(corpus[(epoch+5)%corpus.length],.14),0,0);x.restore()}}
function fragments(){let l=(T+1)%31;if(l<1.4){let k=l/1.4,src=anchors[epoch%4].s;[...src].forEach((ch,i)=>{let a=i*2.3+epoch,r=30+180*E(k);x.save();x.translate(W*.5+Math.cos(a)*r,H*.5+Math.sin(a*.77)*r*.5);x.rotate(a*k);x.globalAlpha=(1-k)*.8;x.fillStyle=colors[(i+epoch)%5];x.font=`700 ${18+(i%4)*9}px Helvetica Neue`;x.fillText(Math.random()<.25?glyph[(Math.random()*glyph.length)|0]:ch,0,0);x.restore()})}}
function loop(now){let dt=Math.min(45,now-last)/1000;last=now;T+=dt;let e=Math.floor(T/9);if(e!==epoch){epoch=e;if(e%2===0){cam.tx=R(.28,-.28);cam.ty=R(.13,-.13);cam.tz=R(1.65,.7)}if(e%7===6){cam.x=R(.35,-.35);cam.y=R(.16,-.16)}}let k=.003;cam.x+=(cam.tx-cam.x)*k*dt*60;cam.y+=(cam.ty-cam.y)*k*dt*60;cam.z+=(cam.tz-cam.z)*k*dt*60;background();perspectivePhrase();anchors.forEach(behavior);ribbon();fragments();requestAnimationFrame(loop)}requestAnimationFrame(loop);c.addEventListener('pointerdown',e=>{cam.tx+=(e.clientX/W-.5)*.25;cam.ty+=(e.clientY/H-.5)*.15;T+=R(2.5,.4)});document.getElementById('capture').onclick=()=>c.toBlob(async b=>{let f=new File([b],`phonema-004-3-4-${Date.now()}.png`,{type:'image/png'});try{if(navigator.canShare?.({files:[f]})){await navigator.share({files:[f]});return}}catch(e){}let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click()},'image/png',1)})();</script></body></html>
