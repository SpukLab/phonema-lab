<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050507"><title>Phonema — 004.3.2 Temporal Polyphony</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050507;color:#eee}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.ui{position:fixed;z-index:10;right:12px;top:max(12px,env(safe-area-inset-top));display:flex;gap:6px;opacity:.2}.ui:hover{opacity:.9}.ui a,.ui button{border:1px solid #ffffff18;background:#08090bcc;color:#999;border-radius:99px;padding:9px 11px;font:9px ui-monospace,monospace;letter-spacing:.12em;text-decoration:none}.label{position:fixed;left:17px;bottom:17px;color:#41434a;font:9px ui-monospace,monospace;letter-spacing:.16em}</style></head><body><canvas id="c"></canvas><nav class="ui"><a href="../index.html">BACK</a><button id="capture">CAPTURE</button><button onclick="location.reload()">RESTART</button></nav><div class="label">004.3.2 · TEMPORAL POLYPHONY</div><script>(()=>{const c=document.getElementById('c'),g=c.getContext('2d');let W,H,D,last=performance.now(),T=0,epoch=0,camX=0,camY=0,camZ=1,targetX=0,targetY=0,targetZ=1,impulse=0;const words=['NACISTE','CAMINASTE','JAMÁS TE DETUVISTE A PENSAR','DESCARGASTE','TÍTERES','POLÍTICA','PSICOLOGÍA','RELIGIÓN','A QUIÉN HOY PUEDES ESCUCHAR','ESTÍMULOS','HACIA DÓNDE MIRAR','CEGADO','CONOCIMIENTO','INMUTABLE','OPRIMIDO','SAQUEANDO','IMPUNIDAD','CONTRADICCIÓN','ARMONÍA'];const colors=['#eee9df','#8dc5c3','#d35b9c','#e3a64f','#7776a4'];const R=(a,b=0)=>b+Math.random()*(a-b),C=(v,a,b)=>Math.max(a,Math.min(b,v)),S=v=>v*v*(3-2*v);function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const field=Array.from({length:13},(_,i)=>({s:words[i],x:R(1.7,-1.7),y:R(.9,-.9),z:R(4.5,.55),size:R(58,14),a:R(.72,.16),phase:R(6.2),color:colors[i%colors.length],font:i%5===0?'Georgia':i%4===0?'ui-monospace':'Helvetica Neue',weight:i%3?500:700}));
function proj(o){let z=Math.max(.15,o.z/camZ),f=1/z;return{x:W/2+(o.x-camX)*W*f*.62,y:H/2+(o.y-camY)*H*f*.72,s:f,z}}
function bg(){g.fillStyle='rgba(4,5,8,.34)';g.fillRect(0,0,W,H);let a=.5+.5*Math.sin(T*.08);let q=g.createRadialGradient(W*(.25+.3*a),H*.45,0,W*.5,H*.5,Math.max(W,H)*.8);q.addColorStop(0,`rgba(${20+25*a},${28+22*a},${36+30*a},.22)`);q.addColorStop(.6,'rgba(8,8,13,.10)');q.addColorStop(1,'rgba(0,0,0,.55)');g.fillStyle=q;g.fillRect(0,0,W,H);if(epoch%4===2){g.save();g.globalAlpha=.12;g.fillStyle='#7bb8b5';g.fillRect(0,H*.18,W,H*.035);g.fillStyle='#bb4f8d';g.fillRect(W*.61,0,W*.025,H);g.restore()}}
function baseText(){[...field].sort((a,b)=>b.z-a.z).forEach((o,i)=>{let p=proj(o),sz=o.size*p.s;if(sz<4||sz>600)return;let drift=Math.sin(T*.05+o.phase)*8/p.z;g.save();g.translate(p.x+drift,p.y);g.rotate(Math.sin(o.phase)*.025);g.globalAlpha=C(o.a*(1.15-p.z*.1),.025,.7);g.fillStyle=o.color;g.font=`${o.weight} ${sz}px ${o.font}`;g.textAlign='center';g.fillText(o.s,0,0);g.restore()})}
// Five resources live on different clocks: pulse word, ribbon, letter fracture, color exposure, camera cut.
function pulseWord(){let cycle=T%19;if(cycle<6.8){let p=C(cycle/1.4,0,1),hold=cycle<5?1:C((6.8-cycle)/1.8,0,1);g.save();g.globalAlpha=.88*hold;g.fillStyle=epoch%2?'#e9e4da':'#d05b99';let sz=Math.min(W*.22,230)*(1+.08*(1-S(p)));g.font=`700 ${sz}px Helvetica Neue`;g.translate(W*.08,H*.76);g.fillText(words[(epoch+11)%words.length],0,0);g.restore()}}
function ribbon(){let local=(T+7)%31;if(local<8){let enter=C(local/1.5,0,1),exit=C((8-local)/1.5,0,1),life=Math.min(enter,exit),y=H*(.25+.34*((epoch%3)/2));let xx=W*(-.15+1.25*S(enter));g.save();g.translate(xx,y);g.rotate(-.018);g.globalAlpha=.72*life;let grad=g.createLinearGradient(-W*.6,0,W*.4,0);grad.addColorStop(0,'#70b9b7');grad.addColorStop(.55,'#d45798');grad.addColorStop(1,'#e7ad55');g.fillStyle=grad;g.fillRect(-W*.7,-H*.045,W*1.05,H*.09);g.globalCompositeOperation='destination-out';g.fillStyle='#000';g.font=`600 ${Math.max(20,H*.047)}px Helvetica Neue`;g.textAlign='center';g.textBaseline='middle';g.fillText(words[(epoch+5)%words.length],-W*.16,0);g.restore()}}
function fracture(){let local=(T+3)%23;if(local<2.6){let k=local/2.6,word=words[(epoch+2)%words.length],letters=[...word.replace(/ /g,'')].slice(0,16);letters.forEach((ch,i)=>{let ang=i*2.4+epoch,rad=(30+170*S(k))*(.35+(i%5)/5);g.save();g.translate(W*.5+Math.cos(ang)*rad,H*.46+Math.sin(ang*.83)*rad*.55);g.rotate(Math.sin(ang)*.7*k);g.globalAlpha=(1-k)*.85;g.fillStyle=colors[(i+epoch)%colors.length];g.font=`${i%3?500:800} ${18+(i%4)*12}px Helvetica Neue`;g.fillText(ch,0,0);g.restore()})}}
function exposure(){let local=(T+11)%37;if(local<1.15){let k=Math.sin(local/1.15*Math.PI);g.fillStyle=epoch%2?`rgba(217,70,151,${.15*k})`:`rgba(74,197,196,${.14*k})`;g.fillRect(0,0,W,H)}}
function occlusion(){if(epoch%3===1){g.save();g.globalAlpha=.86;g.fillStyle='#050507';g.fillRect(W*.72,0,W*.34,H);g.globalAlpha=.42;g.fillStyle='#e9e5dc';g.font=`700 ${Math.min(W*.29,360)}px Helvetica Neue`;g.translate(W*.79,H*.92);g.rotate(-Math.PI/2);g.fillText('PENSAR',0,0);g.restore()}}
function tick(now){let dt=Math.min(45,now-last)/1000;last=now;T+=dt;let ne=Math.floor(T/11);if(ne!==epoch){epoch=ne;if(epoch%2===0){targetX=R(.28,-.28);targetY=R(.12,-.12);targetZ=R(1.55,.72)}if(epoch%5===4){camX=R(.34,-.34);camY=R(.14,-.14)}}let e=.0025*(impulse?5:1);camX+=(targetX-camX)*e*dt*60;camY+=(targetY-camY)*e*dt*60;camZ+=(targetZ-camZ)*e*dt*60;impulse*=.94;bg();baseText();ribbon();fracture();pulseWord();occlusion();exposure();requestAnimationFrame(tick)}requestAnimationFrame(tick);
c.addEventListener('pointerdown',e=>{impulse=1;let nx=e.clientX/W-.5,ny=e.clientY/H-.5;targetX+=nx*.22;targetY+=ny*.15;if(Math.random()<.45)T+=R(5,1)});
document.getElementById('capture').onclick=()=>c.toBlob(async b=>{let f=new File([b],`phonema-004-3-2-${Date.now()}.png`,{type:'image/png'});try{if(navigator.canShare?.({files:[f]})){await navigator.share({files:[f]});return}}catch(e){}let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click()},'image/png',1)})();</script></body></html>
