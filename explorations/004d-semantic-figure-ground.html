id="toast">FRAME CAPTURED</div><script>(()=>{'use strict';
const c=document.getElementById('c'),ctx=c.getContext('2d'),toast=document.getElementById('toast');let W=1,H=1,DPR=1,last=performance.now(),T=0,nextShift=18,gesture=0,composition=0,targetComposition=0;
const corpus=[
'DESDE QUE NACISTE, CAMINASTE','JAMÁS TE DETUVISTE A PENSAR','SOBRE OTROS DESCARGASTE','TODO ESO QUE NO PODÍAS LOGRAR','TU ESPALDA ENDEREZASTE','PARA MEJOR TUS TÍTERES CONTROLAR','POLÍTICA, PSICOLOGÍA, RELIGIÓN','A QUIÉN HOY PUEDES ESCUCHAR','QUE CALME TUS PENAS','Y ALIVIE TU PESAR','DESBORDADO DE ESTÍMULOS','TALVEZ NO SEPAS HACIA DÓNDE MIRAR','CEGADO DE CONOCIMIENTO','INMUTABLE ANTE LOS PEQUEÑOS HECHOS','LA CANCIÓN DEL OPRIMIDO','SAQUEANDO Y TOMANDO','LO QUE A OTRO LE PERTENECE','DISFRUTANDO DE TU IMPUNIDAD','ACEPTANDO LA CONTRADICCIÓN','CONVIVIENDO EN ARMONÍA'];
const modern=['system-ui','-apple-system','Avenir Next','Helvetica Neue','Arial'];const serif=['Iowan Old Style','Baskerville','Georgia','Times New Roman'];const mono=['SFMono-Regular','Menlo','Courier New'];const palette=[['#07080b','#e7e3da','#79d5d2','#d35d9f'],['#06070a','#e8dfcd','#547ba4','#c66d3a'],['#030408','#dfe6ea','#7f5ec8','#5dc9ba'],['#090605','#f1dfc8','#c99a3d','#8d415f']];
const rnd=(a=1,b=0)=>b+Math.random()*(a-b),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),pick=a=>a[(Math.random()*a.length)|0],ease=t=>t*t*(3-2*t);
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
function mutatePhrase(s,amount=.08){const glyphs='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/\|—';return s.split('').map(ch=>{if(ch===' '||ch===','||ch==='.'||ch==='Í'||ch==='Ó'||ch==='Á'||ch==='É')return ch;return Math.random()<amount?glyphs[(Math.random()*glyphs.length)|0]:ch}).join('')}
const layers=Array.from({length:12},(_,i)=>({phrase:corpus[i%corpus.length],x:rnd(.12,.88),y:rnd(.12,.88),z:rnd(.08,1.5),rot:rnd(-.035,.035),phase:rnd(0,6.28),family:i%4===0?'serif':i%5===0?'mono':'modern',weight:i%3===0?300:i%4===0?700:500,align:Math.random()<.55?'left':'center',mask:Math.random()<.34,mut:rnd(.02,.12),drift:rnd(.6,.18)}));
const marks=Array.from({length:16},()=>({x:rnd(0,1),y:rnd(0,1),z:rnd(.1,1.3),w:rnd(.04,.22),h:rnd(.004,.035),phase:rnd(0,6.28),tone:(Math.random()*3)|0}));
function fontFor(l){let fam=l.family==='serif'?serif:l.family==='mono'?mono:modern;return pick(fam)}
function recompose(px=.5,py=.5){gesture=1;targetComposition=(targetComposition+1)%5;for(let l of layers){let dx=l.x-px,dy=l.y-py,d=Math.hypot(dx,dy)+.02;l.x+=dx/d*rnd(.015,.08);l.y+=dy/d*rnd(.01,.05);if(Math.random()<.42)l.z=cl(l.z+rnd(-.45,.55),.05,1.8);if(Math.random()<.28)l.mask=!l.mask;if(Math.random()<.22)l.family=pick(['modern','serif','mono']);l.rot+=rnd(-.025,.025);l.mut=cl(l.mut+rnd(-.03,.08),.01,.22)}}
c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect();recompose((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)});
function drawBackground(p){ctx.globalCompositeOperation='source-over';ctx.fillStyle=p[0];ctx.globalAlpha=.19;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;let g=ctx.createRadialGradient(W*.52,H*.48,0,W*.52,H*.48,Math.max(W,H)*.72);g.addColorStop(0,'rgba(18,20,25,.20)');g.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function drawGestalt(p,slow){ctx.save();for(let i=0;i<marks.length;i++){let m=marks[i],z=m.z,par=.42+z*1.38,xx=(m.x-.5)*par*W+W*.5,yy=(m.y-.5)*par*H+H*.5;xx+=Math.sin(T*.035*m.drift+m.phase)*W*.018*slow;yy+=Math.cos(T*.028+m.phase)*H*.012*slow;ctx.globalAlpha=.025+z*.04;ctx.fillStyle=m.tone===0?p[2]:m.tone===1?p[3]:p[1];ctx.fillRect(xx-W*m.w*.5,yy-H*m.h*.5,W*m.w,H*m.h)}ctx.restore();
// proximity / closure constellation
ctx.save();ctx.globalAlpha=.08;ctx.strokeStyle=p[2];ctx.lineWidth=1;for(let i=0;i<6;i++){let cx=W*(.18+i*.13),cy=H*(.25+Math.sin(T*.04+i)*.05);ctx.beginPath();ctx.arc(cx,cy,18+i*5,-.2,4.2);ctx.stroke()}ctx.restore()}
function drawCutout(text,x0,y0,size,font,rot,p,alpha=.75){ctx.save();ctx.translate(x0,y0);ctx.rotate(rot);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`800 ${size}px ${font}`;let mw=ctx.measureText(text).width+size*.8,mh=size*1.3;let off=document.createElement('canvas'),o=off.getContext('2d');off.width=Math.max(2,Math.ceil(mw*DPR));off.height=Math.max(2,Math.ceil(mh*DPR));o.scale(DPR,DPR);let ow=off.width/DPR,oh=off.height/DPR;let grad=o.createLinearGradient(0,0,ow,oh);grad.addColorStop(0,p[2]);grad.addColorStop(.5,p[1]);grad.addColorStop(1,p[3]);o.fillStyle=grad;o.fillRect(0,0,ow,oh);o.globalCompositeOperation='destination-out';o.textAlign='center';o.textBaseline='middle';o.font=`800 ${size}px ${font}`;o.fillText(text,ow/2,oh/2);ctx.globalAlpha=alpha;ctx.drawImage(off,-mw/2,-mh/2,mw,mh);ctx.restore()}
function drawLayer(l,p,slow,index){l.phase+=.0008;let z=l.z,depth=.38+z*1.55;let cx=(l.x-.5)*depth*W+W*.5,cy=(l.y-.5)*depth*H+H*.5;cx+=Math.sin(T*.022*l.drift+l.phase)*W*.012*slow;cy+=Math.cos(T*.019*l.drift+l.phase)*H*.009*slow;let family=fontFor(l),base=l.family==='mono'?15:l.family==='serif'?28:24,size=base*(.42+z*1.9);if(index%5===0)size*=1.65;if(index%7===0)size*=.6;let text=mutatePhrase(l.phrase,l.mut*(.25+gesture*.75));ctx.save();ctx.translate(cx,cy);ctx.rotate(l.rot+Math.sin(T*.018+l.phase)*.008);ctx.textBaseline='middle';ctx.textAlign=l.align;ctx.font=`${l.weight} ${size}px ${family}`;ctx.globalAlpha=cl(.08+z*.36,.06,.72);ctx.fillStyle=z>1.05?p[1]:z>.52?p[2]:'#58606a';let width=ctx.measureText(text).width;
// continuation / figure-ground: some words disappear behind a moving plane
if(index%4===1){ctx.save();ctx.beginPath();let clipW=W*(.28+.1*Math.sin(T*.025+l.phase));ctx.rect(-clipW*.5,-H,clipW,H*2);ctx.clip();ctx.fillText(text,0,0);ctx.restore();ctx.globalAlpha*=.24;ctx.translate(width*.16,0);ctx.fillText(text,0,0)}else if(l.mask&&size>22){ctx.restore();drawCutout(text,cx,cy,size,family,l.rot,p,.52);return}else ctx.fillText(text,0,0);
// same-word variant as a second semantic plane
if(index%3===0){ctx.globalAlpha*=.28;ctx.fillStyle=index%2?p[3]:p[2];ctx.translate(size*.18,-size*.22);ctx.scale(1.01,.98);ctx.fillText(mutatePhrase(l.phrase,l.mut*.6),0,0)}ctx.restore()}
function render(ts){let dt=Math.min(40,ts-last);last=ts;T+=dt/1000;gesture*=Math.pow(.986,dt/16.7);composition+=(targetComposition-composition)*Math.min(1,dt*.00035);if(T>nextShift){targetComposition=(targetComposition+1)%5;nextShift=T+rnd(20,42)}let p=palette[targetComposition%palette.length];let slow=.35+.65*(1-gesture);drawBackground(p);drawGestalt(p,slow);
// cinematic camera breathing — deliberately slow
let zoom=1+Math.sin(T*.027)*.018+Math.sin(T*.011)*.014;ctx.save();ctx.translate(W*.5,H*.5);ctx.scale(zoom,zoom);ctx.translate(-W*.5,-H*.5);
let ordered=[...layers].sort((a,b)=>a.z-b.z);ordered.forEach((l,i)=>drawLayer(l,p,slow,i));ctx.restore();
// large foreground cutout enters rarely, then decelerates
let phase=(T%36)/36;if(phase>.64&&phase<.94){let q=ease((phase-.64)/.30),phrase=corpus[(Math.floor(T/36)*3)%corpus.length],font=pick(modern),size=Math.min(W*.12,150),x0=W*(1.18-q*.72),y0=H*(.56+Math.sin(q*Math.PI)*.05);drawCutout(phrase,x0,y0,size,font,-.018,p,.62*(1-Math.abs(q-.72)*.5))}
// negative-space shutter: figure/background reversal
if(targetComposition===4){ctx.save();ctx.globalCompositeOperation='source-over';ctx.fillStyle='rgba(235,231,222,.035)';ctx.fillRect(0,H*.18,W,H*.11);ctx.fillRect(0,H*.71,W,H*.08);ctx.restore()}
requestAnimationFrame(render)}requestAnimationFrame(render);
function capture(){c.toBlob(async b=>{if(!b)return;let stamp=new Date().toISOString().replace(/[:.]/g,'-'),name=`phonema-004-3-${stamp}.png`,file=new File([b],name,{type:'image/png'});try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'Phonema 004.3 — Semantic Figure Ground'});show();return}}catch(e){if(e?.name==='AbortError')return}let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1200);show()},'image/png',1)}function show(){toast.style.opacity=1;clearTimeout(show.t);show.t=setTimeout(()=>toast.style.opacity=0,1100)}document.getElementById('capture').onclick=capture;document.getElementById('restart').onclick=()=>location.reload();document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen?.();})();</script></body></html>
