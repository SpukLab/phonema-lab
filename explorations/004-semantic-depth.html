<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050507"><title>Phonema V2 — Exploration 004</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050507;color:#eee;font-family:Arial,Helvetica,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.ui{position:fixed;z-index:5;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.ui a,.ui button{border:1px solid #25252b;background:#08080b99;color:#777;border-radius:999px;padding:10px 14px;font:10px ui-monospace,monospace;letter-spacing:.15em;text-decoration:none}.label{position:fixed;z-index:4;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));font:10px ui-monospace,monospace;letter-spacing:.22em;color:#444}.hint{position:fixed;z-index:4;right:20px;bottom:20px;font:9px ui-monospace,monospace;letter-spacing:.14em;color:#303038}.flash{position:fixed;inset:0;pointer-events:none;background:#eafaff;opacity:0;mix-blend-mode:screen}.toast{position:fixed;left:50%;bottom:max(52px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;padding:8px 12px;border:1px solid #292931;border-radius:999px;background:#09090dcc;color:#aaa;font:9px ui-monospace,monospace;letter-spacing:.14em;opacity:0;transition:opacity .2s;pointer-events:none}</style></head><body><canvas id="c"></canvas><div class="flash" id="flash"></div><div class="ui"><a href="../index.html">BACK</a><button id="restart">RESTART</button><button id="capture">CAPTURE</button><button id="full">FULL</button></div><div class="label">PHONEMA V2 · EXPLORATION 004 · SEMANTIC DEPTH</div><div class="hint">TOUCH / CLICK → EXCITE LANGUAGE</div><div class="toast" id="toast">FRAME CAPTURED</div><script>
const c=document.getElementById('c'),x=c.getContext('2d'),flash=document.getElementById('flash'),toast=document.getElementById('toast');let W,H,D=1,t=0,last=performance.now(),energy=.12,shock=0,nextEvent=16+Math.random()*18;
const vocab=['VOICE','BODY','MEMORY','LIGHT','BEHIND','INSIDE','ERASE','RETURN','MOUTH','TRACE','SIGNAL','SKIN','OTHER','HERE','AGAIN','NO VOICE','REMEMBER','LOOKING','AFTER','BEFORE','LENGUA','LUZ','CUERPO','MEMORIA','OTRO','ADENTRO'];
const fragments=['V','O','I','C','E','L','U','Z','M','E','M','O','R','Y','A','F','T','E','R','?','//','01','NO','OTRO'];
let nodes=[],scraps=[];function rnd(a,b){return a+Math.random()*(b-a)}function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function makeNode(i){let z=rnd(.15,1);return{word:vocab[i%vocab.length],x:rnd(.08,.92),y:rnd(.12,.88),z,base:z,rot:rnd(-.09,.09),vx:rnd(-.000018,.000018),vy:rnd(-.000012,.000012),phase:rnd(0,6.28),life:rnd(.4,1),kind:Math.random()<.2?'giant':'word'}}for(let i=0;i<46;i++)nodes.push(makeNode(i));
function burst(px=.5,py=.5,power=1){energy=Math.min(1,energy+.5*power);shock=1;flash.style.transition='none';flash.style.opacity=.15*power;requestAnimationFrame(()=>{flash.style.transition='opacity .7s ease';flash.style.opacity=0});for(let i=0;i<55*power;i++){let a=rnd(0,Math.PI*2),sp=rnd(.02,.24);scraps.push({s:fragments[(Math.random()*fragments.length)|0],x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,z:rnd(.25,1.4),life:rnd(.6,1.7),rot:rnd(-2,2)})}for(let i=0;i<nodes.length;i++)if(Math.random()<.42*power){nodes[i].z=Math.min(1.8,nodes[i].z+rnd(.2,.9));nodes[i].rot+=rnd(-.25,.25)}}
function excite(e){let r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;burst((p.clientX-r.left)/r.width,(p.clientY-r.top)/r.height,1)}c.addEventListener('pointerdown',excite);document.getElementById('restart').onclick=()=>location.reload();document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen?.();
function showToast(){toast.style.opacity=1;clearTimeout(showToast._t);showToast._t=setTimeout(()=>toast.style.opacity=0,1200)}
async function captureFrame(){c.toBlob(async blob=>{if(!blob)return;const stamp=new Date().toISOString().replace(/[:.]/g,'-'),name=`phonema-004-${stamp}.png`,file=new File([blob],name,{type:'image/png'});try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'Phonema 004 — Semantic Depth'});showToast();return}}catch(e){if(e?.name==='AbortError')return}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);showToast()},'image/png',1)}document.getElementById('capture').onclick=captureFrame;
function draw(now){let dt=Math.min(40,now-last);last=now;t+=dt/1000;energy*=Math.pow(.998,dt);shock*=Math.pow(.993,dt);if(t>nextEvent){burst(rnd(.25,.75),rnd(.3,.7),rnd(.7,1.15));nextEvent=t+rnd(18,42)}x.fillStyle=`rgba(4,4,7,${.16+.14*(1-energy)})`;x.fillRect(0,0,W,H);
for(let k=0;k<3;k++){let ph=t*.025+k*2.1,yy=H*(.2+k*.27)+Math.sin(ph)*H*.035;x.save();x.globalAlpha=.035+energy*.025;x.translate(W*.5,yy);x.rotate(Math.sin(ph*.7)*.025);x.fillStyle=k==1?'#9ad8df':'#ddd5c7';x.fillRect(-W*.48,-H*.07,W*.96,H*.14);x.restore()}
let ordered=[...nodes].sort((a,b)=>a.z-b.z);for(const n of ordered){n.phase+=dt*.00035;n.x+=n.vx*dt*(.5+energy*2);n.y+=n.vy*dt*(.5+energy*2);if(n.x<-.2)n.x=1.2;if(n.x>1.2)n.x=-.2;if(n.y<-.2)n.y=1.2;if(n.y>1.2)n.y=-.2;let breathe=Math.sin(n.phase+t*.17)*.025,zz=Math.max(.08,n.z+breathe),size=(n.kind==='giant'?92:18)*(.42+zz*1.7);if(n.kind==='giant')size=72+zz*95;let px=(n.x-.5)*(1+zz*.2)*W+W*.5,py=(n.y-.5)*(1+zz*.16)*H+H*.5;x.save();x.translate(px,py);x.rotate(n.rot+Math.sin(n.phase+t*.09)*.018);x.font=`${n.kind==='giant'?800:600} ${size}px Arial`;x.textAlign='center';x.textBaseline='middle';let alpha=Math.min(.92,.08+zz*.52)*(n.kind==='giant'?.75:.65);x.globalAlpha=alpha;x.fillStyle=zz>.95?'#f2f0ea':zz>.55?'#b8c4c7':'#596168';x.fillText(n.word,0,0);if(energy>.45&&Math.random()<.012*energy){x.globalAlpha=.25;x.fillStyle='#7ce6e5';x.fillText(n.word,rnd(-8,8),rnd(-4,4))}x.restore();n.z+=(n.base-n.z)*.00012*dt}
for(let i=scraps.length-1;i>=0;i--){let s=scraps[i];s.life-=dt*.0007;s.x+=s.vx*dt*.001;s.y+=s.vy*dt*.001;s.vx*=.997;s.vy*=.997;s.rot+=dt*.0002;x.save();x.translate(s.x*W,s.y*H);x.rotate(s.rot);x.globalAlpha=Math.max(0,s.life)*.65;x.fillStyle=s.z>1?'#f8f4ec':'#92cbd0';x.font=`700 ${12+s.z*24}px ui-monospace,monospace`;x.fillText(s.s,0,0);x.restore();if(s.life<=0)scraps.splice(i,1)}
if(shock>.18){x.save();x.globalAlpha=Math.min(.75,shock*.72);x.fillStyle='#f0eee8';x.textAlign='center';x.textBaseline='middle';x.font=`800 ${Math.min(W*.15,190)}px Arial`;x.translate(W*.5,H*.5);x.scale(1+shock*.18,1);x.fillText(shock>.58?'LOOKING AT YOU':'AFTER IMAGE',0,0);x.restore()}requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
