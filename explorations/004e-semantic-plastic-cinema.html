="toast" id="toast">FRAME CAPTURED</div><script>(()=>{'use strict';
const c=document.getElementById('c'),ctx=c.getContext('2d'),toast=document.getElementById('toast');let W=1,H=1,DPR=1,last=performance.now(),T=0,scene=0,sceneStart=0,nextScene=26,gesture=.0,camX=0,camY=0,camZ=1;

const ribbons=Array.from({length:7},(_,i)=>({phrase:corpus[(i*3+2)%corpus.length],z:rnd(.25,1.55),y:rnd(.12,.9),h:rnd(.052,.115),phase:rnd(0,6.28),speed:rnd(.018,.006),dir:Math.random()<.5?-1:1,rot:rnd(-.014,.014),style:i%3,offset:rnd(-1,1),hold:rnd(.15,.6)}));

const arcs=Array.from({length:9},(_,i)=>({x:rnd(.05,.95),y:rnd(.1,.9),r:rnd(.035,.12),a:rnd(.8,2.6),phase:rnd(0,6.28),z:rnd(.1,1.1)}));
function familyFor(type){return type==='serif'?pick(serif):type==='mono'?pick(mono):pick(sans)}
function mixedWord(text,x,y,size,alpha,p,rot=0,align='center'){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.textBaseline='middle';let chars=[...text],widths=[],total=0;for(let i=0;i<chars.length;i++){let ch=chars[i],fam=i%7===0?pick(serif):i%5===0?pick(mono):pick(sans),s=size*(i%9===0?1.16:i%6===0?.88:1),w=ctx.measureText(ch).width||size*.5;widths.push({ch,fam,s,w});total+=w+(ch===' '?size*.22:size*.015)}let cursor=align==='left'?0:-total*.5;for(let i=0;i<widths.length;i++){let g=widths[i];ctx.font=`${i%8===0?300:i%5===0?700:500} ${g.s}px ${g.fam}`;ctx.globalAlpha=alpha*(i%11===0?.55:1);ctx.fillStyle=i%13===0?p[4]:i%9===0?p[2]:p[1];ctx.fillText(g.ch,cursor,0);cursor+=g.w+(g.ch===' '?size*.22:size*.015)}ctx.restore()}
function drawPlastic(p){ctx.globalCompositeOperation='source-over';ctx.fillStyle=p[0];ctx.fillRect(0,0,W,H);
// soft liquid fields
for(let i=0;i<blobs.length;i++){let b=blobs[i],dx=Math.sin(T*b.speed+b.phase)*W*.12*(.35+b.depth*.3),dy=Math.cos(T*b.speed*.8+b.phase)*H*.09,xx=b.x*W+dx,yy=b.y*H+dy,rr=Math.max(W*b.rx,H*b.ry);let g=ctx.createRadialGradient(xx,yy,0,xx,yy,rr);let col=b.tone===0?'112,153,164':b.tone===1?'133,93,151':b.tone===2?'184,105,142':'180,150,112';g.addColorStop(0,`rgba(${col},${.035+b.depth*.018})`);g.addColorStop(.45,`rgba(${col},${.014+b.depth*.008})`);g.addColorStop(1,`rgba(${col},0)`);ctx.fillStyle=g;ctx.fillRect(xx-rr,yy-rr,rr*2,rr*2)}

// vignette / lens
let vg=ctx.createRadialGradient(W*.5,H*.48,Math.min(W,H)*.12,W*.5,H*.48,Math.max(W,H)*.72);vg.addColorStop(.45,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.62)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H)}
function drawGestalt(p){ctx.save();ctx.globalAlpha=.07;ctx.strokeStyle=p[2];ctx.lineWidth=1;for(let a of arcs){let par=.5+a.z,xx=(a.x-.5)*par*W+W*.5,yy=(a.y-.5)*par*H+H*.5,ang=Math.sin(T*.012+a.phase)*.55;ctx.beginPath();ctx.arc(xx,yy,a.r*Math.min(W,H),ang,ang+a.a);ctx.stroke()}ctx.restore();
// continuation line that nearly forms a figure
ctx.save();ctx.globalAlpha=.04;ctx.strokeStyle=p[1];ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<=18;i++){let xx=i/18*W,yy=H*(.48+Math.sin(i*.55+T*.009)*.032+Math.sin(i*.18)*.018);i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.stroke();ctx.restore()}
function drawGhost(g,p){let par=.48+g.z*1.5,xx=(g.x-.5)*par*W+W*.5+camX*g.z,yy=(g.y-.5)*par*H+H*.5+camY*g.z;ctx.save();ctx.translate(xx,yy);ctx.rotate(g.rot);ctx.textBaseline='middle';ctx.textAlign='center';ctx.font=`${g.family==='mono'?500:400} ${g.size*(.55+g.z)}px ${familyFor(g.family)}`;ctx.globalAlpha=g.alpha*(.55+g.z*.4);ctx.fillStyle=g.z>.8?p[1]:g.z>.4?p[2]:'#67717a';ctx.fillText(g.phrase,0,0);ctx.restore()}
function ribbonProgress(r){let cyc=(T*r.speed+r.offset)%1;if(cyc<0)cyc+=1;let travel=smooth(cl((cyc-.05)/.28,0,1)),hold=cl((cyc-.33)/.34,0,1),exit=smooth(cl((cyc-.67)/.27,0,1));return{travel,hold,exit,cyc}}
function drawRibbon(r,p,index){let q=ribbonProgress(r),z=r.z,par=.6+z*1.18,bandH=H*r.h*(.85+z*.18),from=r.dir>0?-1.25:1.25,to=r.dir>0?.5:.5,out=r.dir>0?1.35:-1.35,xn=from+(to-from)*ease(q.travel)+(out-to)*ease(q.exit),xx=(xn-.5)*par*W+W*.5+camX*z,yy=(r.y-.5)*par*H+H*.5+camY*z;let alpha=(q.travel<1?q.travel:1)*(1-q.exit*.88);ctx.save();ctx.translate(xx,yy);ctx.rotate(r.rot+Math.sin(T*.006+r.phase)*.004);let bandW=W*(r.style===0?1.38:r.style===1?1.08:.84);let grad=ctx.createLinearGradient(-bandW*.5,0,bandW*.5,0);grad.addColorStop(0,index%2?p[3]:p[2]);grad.addColorStop(.42,p[1]);grad.addColorStop(1,index%2?p[4]:p[3]);ctx.globalAlpha=.20+.34*alpha;ctx.fillStyle=grad;ctx.fillRect(-bandW*.5,-bandH*.5,bandW,bandH);

ctx.globalCompositeOperation='destination-out';ctx.globalAlpha=.78*alpha;ctx.textAlign='center';ctx.textBaseline='middle';let size=Math.max(24,bandH*(r.style===2?.68:.78));ctx.font=`${r.style===1?500:700} ${size}px ${pick(sans)}`;ctx.fillText(r.phrase,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=.24*alpha;ctx.fillStyle=p[1];ctx.fillText(r.phrase,4*z,1*z);ctx.restore();

function render(ts){let dt=Math.min(40,ts-last);last=ts;T+=dt/1000;gesture*=Math.pow(.984,dt/16.7);if(T>nextScene){scene=(scene+1)%palettes.length;sceneStart=T;nextScene=T+rnd(28,46)}let p=palettes[scene];camX=Math.sin(T*.0063)*W*.016+Math.sin(T*.0027)*W*.008+gesture*W*.008;camY=Math.cos(T*.0055)*H*.012+gesture*H*.005;camZ=1+Math.sin(T*.004)*.012;

c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;gesture=.85;camX+=(px-.5)*W*.025;camY+=(py-.5)*H*.02;for(let i=0;i<ribbons.length;i++)if(Math.random()<.36){ribbons[i].offset+=rnd(-.12,.12);ribbons[i].y=cl(ribbons[i].y+rnd(-.045,.045),.08,.92);ribbons[i].rot+=rnd(-.005,.005)}});
function capture(){c.toBlob(async b=>{if(!b)return;let stamp=new Date().toISOString().replace(/[:.]/g,'-'),name=`phonema-004-4-${stamp}.png`,file=new File([b],name,{type:'image/png'});try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'Phonema 004.4 — Semantic Plastic Cinema'});show();return}}catch(e){if(e?.name==='AbortError')return}let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1200);show()},'image/png',1)}function show(){toast.style.opacity=1;clearTimeout(show.t);show.t=setTimeout(()=>toast.style.opacity=0,1100)}document.getElementById('capture').onclick=capture;document.getElementById('restart').onclick=()=>location.reload();document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen?.();})();</script></body></html>
