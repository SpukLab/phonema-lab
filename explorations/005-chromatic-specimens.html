<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Phonema 005 — Chromatic Specimens</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.ui{position:fixed;z-index:9;right:10px;top:max(10px,env(safe-area-inset-top));display:flex;gap:5px;flex-wrap:wrap;justify-content:end;max-width:82%}.ui a,.ui button{border:1px solid #ffffff25;background:#080808d9;color:#ddd;border-radius:99px;padding:9px 10px;font:9px ui-monospace,monospace;letter-spacing:.1em;text-decoration:none}.lab{position:fixed;left:14px;bottom:14px;color:#ffffff66;font:9px ui-monospace,monospace;letter-spacing:.14em}</style></head><body><canvas id="c"></canvas><nav class="ui"><a href="../index.html">BACK</a><a href="../archive.html">ARCHIVE</a><button id="next">NEXT WORLD</button><button id="save">SAVE FRAME</button></nav><div class="lab" id="lab">005 · CHROMATIC SPECIMENS</div><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),lab=document.getElementById('lab');let W,H,D,t=0,last=performance.now(),world=0,shot=0;const R=(a,b=0)=>b+Math.random()*(a-b),C=(v,a,b)=>Math.max(a,Math.min(b,v)),E=v=>v*v*(3-2*v),words=['CEGADO','IMPUNIDAD','CONTRADICCIÓN','OPRIMIDO','ESTÍMULOS','ARMONÍA'],phr=['JAMÁS TE DETUVISTE A PENSAR','CEGADO DE CONOCIMIENTO','LA CANCIÓN DEL OPRIMIDO','CONVIVIENDO EN ARMONÍA'];const worlds=[{n:'ACID SIGNAL',bg:'#c8ff00',fg:'#090909',a:'#ff3b00',b:'#7a00ff',font:'Arial Black'},{n:'BLOOD / PAPER',bg:'#e7dfcf',fg:'#160b0b',a:'#a40018',b:'#17285a',font:'Georgia'},{n:'ULTRAVIOLET VOID',bg:'#08060d',fg:'#f0eadf',a:'#b8ff00',b:'#8d24ff',font:'Helvetica Neue'},{n:'SODIUM NIGHT',bg:'#07090a',fg:'#efb34f',a:'#007f8b',b:'#c84b32',font:'Arial Narrow'},{n:'OVEREXPOSED CYAN',bg:'#b9eff1',fg:'#081517',a:'#ff235f',b:'#e7ff45',font:'Avenir Next Condensed'}];function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();function cur(){return worlds[world%worlds.length]}function draw(){let p=cur(),cy=t%18;x.fillStyle=p.bg;x.fillRect(0,0,W,H);let g=x.createRadialGradient(W*(.2+.6*(.5+.5*Math.sin(t*.07))),H*.45,0,W*.5,H*.5,Math.max(W,H)*.75);g.addColorStop(0,p.a+'55');g.addColorStop(.55,p.b+'22');g.addColorStop(1,'#00000000');x.fillStyle=g;x.fillRect(0,0,W,H);x.save();let hand=cy>11?Math.sin(t*7)*2.2:Math.sin(t*.7)*.4;x.translate(hand,Math.cos(t*5.3)*hand*.4);for(let i=0;i<5;i++){let z=.45+i*.42,sc=1/z,xx=W*(.14+i*.18)+Math.sin(t*.08+i)*18,yy=H*(.2+(i%3)*.25);x.save();x.translate(xx,yy);x.rotate((i-2)*.045+Math.sin(t*.12+i)*.02);let local=(t+i*2.7)%15,w=local>5&&local<8?Math.sin((local-5)/3*Math.PI):0;x.scale(1+w*(i%2?3.8:.3),1+w*(i%2?.2:3));x.globalAlpha=.35+.12*i;x.fillStyle=i%3===0?p.a:i%3===1?p.fg:p.b;x.font=`${i===1?400:800} ${Math.min(H*.16,46+55*sc)}px "${i===1?'Georgia':p.font}",sans-serif`;x.textAlign='center';x.fillText(words[(i+shot)%words.length],0,0);x.restore()}let q=(t+4)%22;if(q<7){let k=q/7;x.save();x.translate(W*(1.1-.8*E(k)),H*.72);x.rotate(-.55+.45*k);x.transform(.16+1.5*k,0,-.7*(1-k),1,0,0);x.fillStyle=p.fg;x.globalAlpha=.72*Math.sin(k*Math.PI);x.font=`700 ${Math.max(20,H*.05)}px "${p.font}",sans-serif`;x.fillText(phr[shot%phr.length],0,0);x.restore()}if(cy>7&&cy<10){let k=(cy-7)/3,w=Math.sin(k*Math.PI);x.globalCompositeOperation='difference';x.fillStyle=p.a;x.globalAlpha=.45*w;x.fillRect(W*(.05+.4*k),0,W*.16,H);x.fillStyle=p.b;x.fillRect(W*(.7-.3*k),0,W*.06,H);x.globalCompositeOperation='source-over';x.globalAlpha=1}x.restore();x.globalAlpha=.045;x.fillStyle=p.fg;for(let i=0;i<80;i++)x.fillRect(R(W),R(H),R(1.4,.2),R(1.4,.2));x.globalAlpha=1;lab.textContent=`005 · ${p.n} · WORLD ${world+1}/5`}function loop(n){let dt=Math.min(45,n-last)/1000;last=n;t+=dt;if(Math.floor(t/13)!==shot){shot=Math.floor(t/13);if(shot%3===0)world=(world+1)%worlds.length}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);document.getElementById('next').onclick=()=>{world=(world+1)%worlds.length;t+=.4};c.addEventListener('pointerdown',()=>{t=(Math.floor(t/18)*18)+7.2});function blob(){return new Promise(r=>c.toBlob(r,'image/png',.96))}function dbOpen(){return new Promise((res,rej)=>{let q=indexedDB.open('phonema-archive',1);q.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('captures'))d.createObjectStore('captures',{keyPath:'id'})};q.onsuccess=e=>res(e.target.result);q.onerror=rej})}document.getElementById('save').onclick=async()=>{let b=await blob(),db=await dbOpen(),id=Date.now(),p=cur(),tx=db.transaction('captures','readwrite');tx.objectStore('captures').put({id,blob:b,specimen:'005 · CHROMATIC SPECIMENS',state:p.n,tag:'PALETTE'});tx.oncomplete=()=>{let e=document.getElementById('save');e.textContent='SAVED ✓';setTimeout(()=>e.textContent='SAVE FRAME',900)}}})();</script></body></html>
