<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Phonema 007 — Light Body</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.ui{position:fixed;z-index:9;right:10px;top:max(10px,env(safe-area-inset-top));display:flex;gap:5px}.ui a,.ui button{border:1px solid #fff2;background:#000b;color:#aaa;border-radius:99px;padding:9px 10px;font:9px ui-monospace,monospace;letter-spacing:.1em;text-decoration:none}.lab{position:fixed;left:14px;bottom:14px;color:#fff4;font:9px ui-monospace,monospace;letter-spacing:.14em}</style></head><body><canvas id="c"></canvas><nav class="ui"><a href="../index.html">BACK</a><a href="../archive.html">ARCHIVE</a><button id="save">SAVE FRAME</button></nav><div class="lab">007 · LIGHT BODY / SEMANTIC AFTERIMAGE</div><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D,t=0,last=performance.now(),pts=[];const words=['CEGADO','OPRIMIDO','IMPUNIDAD','CONTRADICCIÓN'];function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);pts=[];for(let i=0;i<900;i++)pts.push({x:Math.random()*W,y:Math.random()*H,z:Math.random(),p:Math.random()*6.28})}addEventListener('resize',resize);resize();function draw(){x.fillStyle='rgba(0,0,0,.13)';x.fillRect(0,0,W,H);let slow=(t%24>9&&t%24<15),speed=slow?.08:1;for(let i=0;i<pts.length;i++){let p=pts[i],cx=W*(.5+.22*Math.sin(t*.07)),cy=H*(.5+.18*Math.cos(t*.09)),dx=cx-p.x,dy=cy-p.y,d=Math.hypot(dx,dy)+1,sw=Math.sin(t*.35*speed+p.p);p.x+=dx/d*(.08+p.z*.16)*speed+Math.cos(p.p+t*.2)*.06;p.y+=dy/d*(.08+p.z*.16)*speed+Math.sin(p.p+t*.17)*.06;let a=.04+p.z*.16+(d<Math.min(W,H)*.18?.15:0);x.fillStyle=i%7===0?`rgba(213,35,92,${a})`:i%11===0?`rgba(77,218,230,${a})`:`rgba(235,231,219,${a})`;x.fillRect(p.x,p.y,1+p.z*1.5,1+p.z*1.5)}let local=t%16,idx=Math.floor(t/16)%words.length,w=words[idx];if(local>4&&local<10){let q=(local-4)/6,a=Math.sin(q*Math.PI),size=H*(.12+.38*a);x.save();x.translate(W*.5,H*.5);x.rotate(-.18+.36*q);x.globalCompositeOperation='screen';x.shadowBlur=28+80*a;x.shadowColor=idx%2?'#d5235c':'#4ddae6';x.globalAlpha=.18+.62*a;x.fillStyle='#eee9df';x.font=`800 ${size}px Arial Narrow`;x.textAlign='center';x.fillText(w,0,0);x.restore();if(q>.45){x.save();x.globalCompositeOperation='destination-out';x.globalAlpha=.25*a;x.font=`900 ${size*1.35}px Arial Black`;x.textAlign='center';x.fillText(w,W*.5,H*.52);x.restore()}}let e=(t+5)%29;if(e<1.2){let a=Math.sin(e/1.2*Math.PI),g=x.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,Math.max(W,H)*.7);g.addColorStop(0,`rgba(255,235,210,${.34*a})`);g.addColorStop(.25,`rgba(213,35,92,${.18*a})`);g.addColorStop(1,'rgba(0,0,0,0)');x.globalCompositeOperation='screen';x.fillStyle=g;x.fillRect(0,0,W,H);x.globalCompositeOperation='source-over'}}function loop(n){let dt=Math.min(45,n-last)/1000;last=n;t+=dt;draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);c.addEventListener('pointerdown',()=>t=Math.floor(t/16)*16+5.5);function blob(){return new Promise(r=>c.toBlob(r,'image/png',.96))}function dbOpen(){return new Promise((res,rej)=>{let q=indexedDB.open('phonema-archive',1);q.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('captures'))d.createObjectStore('captures',{keyPath:'id'})};q.onsuccess=e=>res(e.target.result);q.onerror=rej})}document.getElementById('save').onclick=async()=>{let b=await blob(),db=await dbOpen(),id=Date.now(),tx=db.transaction('captures','readwrite');tx.objectStore('captures').put({id,blob:b,specimen:'007 · LIGHT BODY',state:words[Math.floor(t/16)%words.length],tag:'LIGHT'});tx.oncomplete=()=>{let e=document.getElementById('save');e.textContent='SAVED ✓';setTimeout(()=>e.textContent='SAVE FRAME',900)}}})();</script></body></html>
