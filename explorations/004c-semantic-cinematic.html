const c=document.getElementById('c'),ctx=c.getContext('2d'),toast=document.getElementById('toast');let W=1,H=1,DPR=1,last=performance.now(),T=0,stateClock=0,stateIndex=0,energy=.12,shock=0,freeze=0;
const corpus=`Desde que naciste, caminaste. Jamás te detuviste a pensar. Sobre otros descargaste, todo eso que no podías lograr. Tu espalda enderezaste para mejor tus títeres controlar. Política, psicología, religión… a quien hoy puedes escuchar. Que calme tus penas y alivie tu pesar. Desbordado de estímulos talvez no sepas hacia donde mirar. Cegado de conocimiento. Inmutable ante los pequeños hechos. Y así vas cantando la canción del oprimido, saqueando y tomando lo que a otro le pertenece, convenciéndote y disfrutando de tu impunidad. Aceptando la contradicción, conviviendo en armonía.`;
const phrases=['DESDE QUE NACISTE','JAMÁS TE DETUVISTE A PENSAR','SOBRE OTROS DESCARGASTE','TUS TÍTERES CONTROLAR','POLÍTICA · PSICOLOGÍA · RELIGIÓN','A QUIÉN HOY PUEDES ESCUCHAR','DESBORDADO DE ESTÍMULOS','HACIA DÓNDE MIRAR','CEGADO DE CONOCIMIENTO','INMUTABLE ANTE LOS PEQUEÑOS HECHOS','LA CANCIÓN DEL OPRIMIDO','DISFRUTANDO DE TU IMPUNIDAD','ACEPTANDO LA CONTRADICCIÓN','CONVIVIENDO EN ARMONÍA'];
const words=corpus.toUpperCase().replace(/[.,…]/g,'').split(/\s+/).filter(Boolean),fonts=['Arial','Georgia','Times New Roman','Courier New','Impact','Trebuchet MS','Verdana','Arial Narrow'];
const states=[{name:'ARCHITECTURAL',dur:[16,28]},{name:'OPERATIC',dur:[12,22]},{name:'TACTICAL',dur:[9,16]},{name:'VOID',dur:[7,14]},{name:'COLLAPSE',dur:[6,12]}];
const N=[],dust=[],planes=[];const rnd=(a=1,b=0)=>b+Math.random()*(a-b),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),pick=a=>a[(Math.random()*a.length)|0];
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
function makeNode(i){let z=rnd(.05,1.6),kind=Math.random()<.13?'giant':Math.random()<.27?'micro':'word';return{word:words[i%words.length],x:rnd(-.15,1.15),y:rnd(-.05,1.05),z,home:z,vx:rnd(-.000016,.000016),vy:rnd(-.000014,.000014),vz:rnd(-.00006,.00006),rot:rnd(-.16,.16),vr:rnd(-.00003,.00003),font:pick(fonts),weight:Math.random()<.35?300:Math.random()<.55?600:900,kind,stretch:rnd(.55,1.9),alpha:rnd(.28,.95),phase:rnd(0,6.28)}}for(let i=0;i<74;i++)N.push(makeNode(i));for(let i=0;i<6;i++)planes.push({x:rnd(.2,.8),y:rnd(.1,.9),z:rnd(.1,1.4),w:rnd(.45,1.1),h:rnd(.04,.2),rot:rnd(-.08,.08),tone:i%3,phase:rnd(0,6.28)});
function shiftState(force){stateIndex=force!=null?force:(stateIndex+1)%states.length;stateClock=0;energy=Math.min(1,energy+.34);shock=1;for(let n of N){if(states[stateIndex].name==='TACTICAL'){n.vx+=rnd(-.0003,.0003);n.vy+=rnd(-.00022,.00022)}if(states[stateIndex].name==='OPERATIC'){n.vz+=rnd(-.0006,.0010);n.rot+=rnd(-.3,.3)}if(states[stateIndex].name==='COLLAPSE'){n.vx+=rnd(-.0007,.0007);n.vy+=rnd(-.0007,.0007);n.vz+=rnd(-.001,.001)}}spawnDust(states[stateIndex].name==='COLLAPSE'?140:55)}
function spawnDust(count){for(let i=0;i<count;i++)dust.push({s:Math.random()<.72?pick(words):pick(['//','01','?','—','…']),x:rnd(.15,.85),y:rnd(.2,.8),vx:rnd(-.25,.25),vy:rnd(-.22,.22),z:rnd(.1,1.8),life:rnd(.5,1.8),rot:rnd(-2,2),font:pick(fonts)})}
function perturb(e){let r=c.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;energy=1;shock=1;for(let n of N){let dx=n.x-px,dy=n.y-py,d=Math.hypot(dx,dy)+.02;n.vx+=dx/d*rnd(.00008,.00035);n.vy+=dy/d*rnd(.00008,.00035);n.vz+=rnd(-.0005,.0009)}if(Math.random()<.45)shiftState((Math.random()*states.length)|0);spawnDust(85)}c.addEventListener('pointerdown',perturb);
function stateParams(){let s=states[stateIndex].name;if(s==='ARCHITECTURAL')return{bg:'#05060a',accent:'#70d6d7',warm:'#d7d1c6',jitter:.2,zoom:.9,fade:.18,lines:.08};if(s==='OPERATIC')return{bg:'#030205',accent:'#d56bb7',warm:'#e2bd76',jitter:.35,zoom:1.15,fade:.11,lines:.03};if(s==='TACTICAL')return{bg:'#0a0c0d',accent:'#8a9a8d',warm:'#9b8d74',jitter:1.15,zoom:1.02,fade:.27,lines:.15};if(s==='VOID')return{bg:'#010102',accent:'#5a6270',warm:'#bbb7ae',jitter:.05,zoom:.68,fade:.35,lines:.01};return{bg:'#050106',accent:'#e05bb8',warm:'#e8e4dd',jitter:1.7,zoom:1.28,fade:.08,lines:.2}}
function render(ts){let dt=Math.min(40,ts-last);last=ts;T+=dt/1000;stateClock+=dt/1000;energy*=Math.pow(.998,dt);shock*=Math.pow(.992,dt);let st=states[stateIndex],p=stateParams();if(stateClock>rnd(st.dur[0],st.dur[1]))shiftState();ctx.fillStyle=p.bg;ctx.globalAlpha=p.fade;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
// cinematic strata
for(let pl of planes){let z=pl.z+Math.sin(T*.07+pl.phase)*.04,sc=.55+z*1.35,px=(pl.x-.5)*sc*W+W*.5,py=(pl.y-.5)*sc*H+H*.5;ctx.save();ctx.translate(px,py);ctx.rotate(pl.rot+Math.sin(T*.04+pl.phase)*.015);ctx.globalAlpha=.018+z*.035+energy*.02;ctx.fillStyle=pl.tone===0?p.accent:pl.tone===1?p.warm:'#777';ctx.fillRect(-W*pl.w*.5,-H*pl.h*.5,W*pl.w,H*pl.h);ctx.restore()}
let ordered=[...N].sort((a,b)=>a.z-b.z);for(let n of ordered){let m=1-freeze*.9;n.phase+=dt*.00025;n.x+=n.vx*dt*m;n.y+=n.vy*dt*m;n.z+=n.vz*dt*m;n.rot+=n.vr*dt*m;n.vx*=.998;n.vy*=.998;n.vz*=.996;n.vr*=.998;if(st.name==='TACTICAL'){n.x+=Math.sin(T*23+n.phase)*.00045*p.jitter;n.y+=Math.cos(T*19+n.phase)*.00038*p.jitter}if(st.name==='COLLAPSE'){n.rot+=Math.sin(T*8+n.phase)*.0025;n.z+=Math.sin(T*4+n.phase)*.0012*dt}if(n.x<-.5)n.x=1.5;if(n.x>1.5)n.x=-.5;if(n.y<-.45)n.y=1.45;if(n.y>1.45)n.y=-.45;if(n.z<.03){n.z=.03;n.vz=Math.abs(n.vz)}if(n.z>2){n.z=2;n.vz=-Math.abs(n.vz)}n.z+=(n.home-n.z)*.000025*dt;let z=Math.max(.04,n.z),persp=(.42+z*1.85)*p.zoom,px=(n.x-.5)*persp*W+W*.5,py=(n.y-.5)*persp*H+H*.5,base=n.kind==='giant'?110:n.kind==='micro'?8:22,size=base*(.3+z*1.7);if(st.name==='VOID')size*=.55;if(st.name==='OPERATIC'&&n.kind==='giant')size*=1.35;ctx.save();ctx.translate(px,py);ctx.rotate(n.rot);ctx.scale(n.stretch,1);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`${n.weight} ${size}px ${n.font}`;ctx.globalAlpha=cl(n.alpha*(.08+z*.5),.03,.94);ctx.fillStyle=z>1.1?p.warm:z>.55?'#a9b2b6':'#4b5158';ctx.fillText(n.word,0,0);ctx.restore()}
for(let i=dust.length-1;i>=0;i--){let d=dust[i];d.life-=dt*.0007;d.x+=d.vx*dt*.001;d.y+=d.vy*dt*.001;d.vx*=.995;d.vy*=.995;d.rot+=dt*.00045;let sc=.5+d.z*1.5;ctx.save();ctx.translate((d.x-.5)*sc*W+W*.5,(d.y-.5)*sc*H+H*.5);ctx.rotate(d.rot);ctx.globalAlpha=Math.max(0,d.life)*.45;ctx.fillStyle=d.z>1?p.warm:p.accent;ctx.font=`700 ${8+d.z*27}px ${d.font}`;ctx.fillText(d.s,0,0);ctx.restore();if(d.life<=0)dust.splice(i,1)}
// phrase layer behaves differently per state
let phrase=phrases[(Math.floor(T/7)+stateIndex)%phrases.length];if(st.name!=='VOID'||shock>.25){ctx.save();ctx.translate(W*.5,H*.5);let jitterX=st.name==='TACTICAL'?Math.sin(T*31)*8:0,jitterY=st.name==='TACTICAL'?Math.cos(T*27)*5:0;ctx.translate(jitterX,jitterY);ctx.textAlign='center';ctx.textBaseline='middle';ctx.globalAlpha=st.name==='ARCHITECTURAL'?.36:st.name==='OPERATIC'?.58:st.name==='TACTICAL'?.28:st.name==='COLLAPSE'?.52:.12;ctx.fillStyle=st.name==='OPERATIC'?p.warm:'#f0ede6';ctx.font=`${st.name==='OPERATIC'?300:900} ${Math.min(W*(st.name==='OPERATIC'?.085:.12),170)}px ${st.name==='OPERATIC'?'Georgia':'Arial'}`;if(st.name==='COLLAPSE'){ctx.rotate(Math.sin(T*2)*.09);ctx.scale(1.4,1)}ctx.fillText(phrase,0,0);ctx.restore()}
// tactical data scars
if(st.name==='TACTICAL'){ctx.save();ctx.globalAlpha=.14;ctx.strokeStyle=p.accent;ctx.lineWidth=1;for(let i=0;i<9;i++){let y=H*(.12+i*.095)+Math.sin(T*11+i)*3;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y+rnd(-2,2));ctx.stroke()}ctx.font='10px ui-monospace,monospace';ctx.fillStyle=p.accent;ctx.fillText(`STATE ${stateIndex} / ${T.toFixed(2)} / ${Math.floor(energy*100)}`,18,36);ctx.restore()}
if(st.name==='COLLAPSE'&&shock>.08){ctx.save();ctx.globalAlpha=.12*shock;ctx.fillStyle=p.accent;for(let i=0;i<10;i++)ctx.fillRect(rnd(0,W),rnd(0,H),rnd(15,160),rnd(2,12));ctx.restore()}
requestAnimationFrame(render)}requestAnimationFrame(render);
function capture(){c.toBlob(async b=>{if(!b)return;let stamp=new Date().toISOString().replace(/[:.]/g,'-'),name=`phonema-004-2-${stamp}.png`,file=new File([b],name,{type:'image/png'});try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'Phonema 004.2 — Semantic Cinematic'});show();return}}catch(e){if(e?.name==='AbortError')return}let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1200);show()},'image/png',1)}function show(){toast.style.opacity=1;clearTimeout(show.t);show.t=setTimeout(()=>toast.style.opacity=0,1100)}document.getElementById('capture').onclick=capture;document.getElementById('restart').onclick=()=>location.reload();document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen?.();})();</script></body></html>
