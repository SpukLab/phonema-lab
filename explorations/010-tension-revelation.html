<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Phonema 010 — Tension / Revelation</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.ui{position:fixed;z-index:9;right:10px;top:max(10px,env(safe-area-inset-top));display:flex;gap:5px;opacity:.24}.ui:hover{opacity:.95}.ui a,.ui button{border:1px solid #fff2;background:#020203df;color:#aaa;border-radius:99px;padding:9px 10px;font:9px ui-monospace,monospace;letter-spacing:.1em;text-decoration:none}.state,.label{position:fixed;left:14px;color:#ffffff40;font:9px ui-monospace,monospace;letter-spacing:.14em}.state{top:max(14px,env(safe-area-inset-top))}.label{bottom:14px}</style></head><body><canvas id="c"></canvas><nav class="ui"><a href="../index.html">BACK</a><a href="../archive.html">ARCHIVE</a><button id="save">SAVE FRAME</button></nav><div class="state" id="state">DENSITY · 0</div><div class="label">010 · TENSION / REVELATION · MAXIMAL ACCUMULATION</div><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),state=document.getElementById('state');let W,H,D,last=performance.now(),t=0,world=0,shot=-1,flash=0;const R=(a,b=0)=>b+Math.random()*(a-b),C=(v,a,b)=>Math.max(a,Math.min(b,v)),E=v=>v*v*(3-2*v),INK='#e8e5df',CY='#75d7df',MG='#ec286e',ASH='#34363b',glyph='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/\\|—+×';const words=['CEGADO','OPRIMIDO','IMPUNIDAD','CONTRADICCIÓN','ARMONÍA'],phr=['JAMÁS TE DETUVISTE A PENSAR','DESBORDADO DE ESTÍMULOS','HACIA DÓNDE MIRAR','CEGADO DE CONOCIMIENTO','LA CANCIÓN DEL OPRIMIDO','CONVIVIENDO EN ARMONÍA'];let dust=[],lines=[];function resize(){D=Math.min(devicePixelRatio||1,1.6);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);dust=Array.from({length:260},()=>({x:R(W),y:R(H),z:R(1),p:R(6.28)}));lines=Array.from({length:18},()=>({y:R(H),a:R(.1,.01),v:R(14,-14),l:R(W*.4,W*.05)}))}addEventListener('resize',resize);resize();function mut(s,a){return [...s].map(ch=>(ch===' '||Math.random()>a)?ch:glyph[(Math.random()*glyph.length)|0]).join('')}function phase(){let q=t%84;if(q<12)return[0,q/12];if(q<28)return[1,(q-12)/16];if(q<48)return[2,(q-28)/20];if(q<65)return[3,(q-48)/17];if(q<73)return[4,(q-65)/8];return[5,(q-73)/11]}function bg(dens){x.fillStyle='rgba(0,0,0,.16)';x.fillRect(0,0,W,H);let g=x.createRadialGradient(W*(.42+.12*Math.sin(t*.04)),H*(.44+.09*Math.cos(t*.05)),0,W*.5,H*.5,Math.max(W,H)*.72);g.addColorStop(0,`rgba(24,28,33,${.09+.09*dens})`);g.addColorStop(.55,'rgba(7,8,10,.06)');g.addColorStop(1,'rgba(0,0,0,.75)');x.fillStyle=g;x.fillRect(0,0,W,H);for(let p of dust){p.x+=Math.sin(t*.09+p.p)*(.03+.1*dens);p.y+=Math.cos(t*.07+p.p)*(.02+.06*dens);x.globalAlpha=.012+p.z*.04*dens;x.fillStyle=p.z>.82?CY:'#4b4d52';let s=.4+p.z*1.2;x.fillRect(p.x,p.y,s,s)}x.globalAlpha=1}function materialWord(i,dens,energy){let z=.48+i*.42,sc=1/z,sz=Math.min(H*.24,(38+i*13)*sc*(1+energy*(i%2?1.8:3.5))),xx=W*(.15+i*.17)+Math.sin(t*.09+i)*W*.025*dens,yy=H*(.2+(i%3)*.27);x.save();x.translate(xx,yy);x.rotate((i-2)*.035+Math.sin(t*.13+i)*.025*dens);x.scale(i===2?1+energy*4:1,i===1?1+energy*2.5:1);let gr=x.createLinearGradient(-sz*2,-sz*.5,sz*2,sz*.5);gr.addColorStop(0,i===2?'#48101f':'#24282c');gr.addColorStop(.28,i===2?MG:'#b8bec0');gr.addColorStop(.48,INK);gr.addColorStop(.58,i===0?CY:'#65696d');gr.addColorStop(1,'#17191c');x.fillStyle=gr;x.globalAlpha=.22+.58*C(dens+.15,0,1);x.shadowBlur=energy*24;x.shadowColor=i%2?MG:CY;x.font=`900 ${sz}px "Arial Narrow","Helvetica Neue",sans-serif`;x.textAlign='center';x.textBaseline='middle';let s=mut(words[i],energy*.12);x.fillText(s,0,0);x.globalCompositeOperation='destination-out';x.globalAlpha=.08+.16*dens;for(let j=0;j<20+dens*45;j++)x.fillRect(R(sz*2,-sz*2),R(sz*.45,-sz*.45),R(5,.4),R(1.4,.2));x.restore()}function ribbons(dens){if(dens<.28)return;let local=(t+4)%13;if(local>3.2)return;let q=local/3.2,a=Math.sin(q*Math.PI),n=dens>.7?3:1;for(let j=0;j<n;j++){let y=H*(.18+j*.28+.05*Math.sin(t+j)),dir=j%2?1:-1,xx=W*(.5+dir*(q-.5)*1.3);x.save();x.translate(xx,y);x.rotate((j-1)*.04);x.globalAlpha=a*(.18+.32*dens);x.fillStyle=j%2?MG:CY;x.fillRect(-W*.42,-H*.025,W*.84,H*.05);x.globalCompositeOperation='destination-out';x.fillStyle='#000';x.font=`800 ${Math.max(16,H*.035)}px Arial Narrow`;x.textAlign='center';x.textBaseline='middle';x.fillText(mut(phr[(j+shot)%phr.length],.06*dens),0,0);x.restore()}}function fragments(dens,energy){if(dens<.35)return;let cx=W*(.3+.4*((shot%4)/3)),cy=H*(.28+.4*((shot*3%5)/4)),n=Math.floor(12+dens*55);x.save();x.globalCompositeOperation='screen';for(let i=0;i<n;i++){let a=i*2.399+shot,r=(20+i*4)*energy,xx=cx+Math.cos(a)*r,yy=cy+Math.sin(a*.7)*r*.55;x.globalAlpha=.025+energy*(i%11===0?.38:.07);x.fillStyle=i%13===0?MG:i%7===0?CY:INK;x.font=`700 ${12+(i%9)*5}px Arial Narrow`;x.fillText(glyph[i%glyph.length],xx,yy)}x.restore()}function geometry(dens){if(dens<.45)return;x.save();x.strokeStyle=CY;x.lineWidth=.6;for(let i=0;i<lines.length;i++){let l=lines[i],xx=(t*l.v+i*83)%(W+l.l)-l.l;x.globalAlpha=l.a*dens;x.beginPath();x.moveTo(xx,l.y);x.lineTo(xx+l.l,l.y+Math.sin(t*.2+i)*18);x.stroke()}x.globalAlpha=.08*dens;x.strokeStyle=MG;for(let i=0;i<4;i++){x.beginPath();x.arc(W*.52,H*.5,H*(.12+i*.08+Math.sin(t*.03+i)*.01),0,Math.PI*1.4);x.stroke()}x.restore()}function macro(dens){if(dens<.18)return;let l=(t+3)%29;if(l>8)return;let q=l/8,a=Math.sin(q*Math.PI),s=words[(shot+2)%words.length],ch=s[(shot*3)%s.length]||'O';x.save();x.translate(W*(.5+.12*Math.sin(q*5)),H*(.48+.08*Math.cos(q*3)));x.rotate(-.18+.34*q);x.globalAlpha=(.035+.18*dens)*a;x.fillStyle=shot%2?INK:CY;x.shadowBlur=18*a*dens;x.shadowColor=shot%2?MG:CY;x.font=`900 ${Math.min(Math.max(W,H)*1.6,1800)}px Arial Black`;x.textAlign='center';x.textBaseline='middle';x.fillText(ch,0,0);x.restore()}function flare(dens,energy){flash*=.88;if(energy>.7&&Math.random()<.012)flash=1;if(flash<.02)return;x.save();x.globalCompositeOperation='screen';let cx=W*(.3+.4*Math.sin(t*.11)),cy=H*(.38+.08*Math.cos(t*.09)),g=x.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.65);g.addColorStop(0,`rgba(255,255,250,${.5*flash})`);g.addColorStop(.1,`rgba(117,215,223,${.16*flash})`);g.addColorStop(.35,`rgba(236,40,110,${.055*flash})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);x.globalAlpha=.13*flash;x.fillStyle='#fff';x.fillRect(0,cy,W,1);x.restore()}function scan(dens){if(dens<.62)return;x.save();x.globalAlpha=.025+.04*dens;x.fillStyle=INK;for(let y=0;y<H;y+=7)x.fillRect(0,y,W,.45);x.globalAlpha=.025*dens;for(let i=0;i<25;i++)x.fillRect(R(W),0,R(1.4,.3),H);x.restore()}function frame(){let [ph,k]=phase(),dens=[.08,.28,.52,.78,1,.18][ph],energy=ph===4?Math.sin(k*Math.PI):ph===3?.35+.3*Math.sin(t*1.8):.08;state.textContent=`DENSITY · ${Math.round(dens*100)} · ${['VOID','ACCUMULATE','PRESSURE','SATURATION','CLIMAX','AFTERMATH'][ph]}`;bg(dens);macro(dens);for(let i=4;i>=0;i--)materialWord(i,dens,energy);geometry(dens);ribbons(dens);fragments(dens,energy);scan(dens);flare(dens,energy);if(ph===5){x.fillStyle=`rgba(0,0,0,${.35+.45*k})`;x.fillRect(0,0,W,H)}}function loop(n){let dt=Math.min(45,n-last)/1000;last=n;t+=dt;world+=dt;let s=Math.floor(t/8);if(s!==shot)shot=s;frame();requestAnimationFrame(loop)}requestAnimationFrame(loop);c.addEventListener('pointerdown',()=>{let base=Math.floor(t/84)*84;t=base+48+R(20)});function blob(){return new Promise(r=>c.toBlob(r,'image/png',.96))}function dbOpen(){return new Promise((res,rej)=>{let q=indexedDB.open('phonema-archive',1);q.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('captures'))d.createObjectStore('captures',{keyPath:'id'})};q.onsuccess=e=>res(e.target.result);q.onerror=rej})}document.getElementById('save').onclick=async()=>{let b=await blob(),db=await dbOpen(),id=Date.now(),tx=db.transaction('captures','re
