<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Phonema Archive</title><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050609;color:#dedbd2;font-family:system-ui,-apple-system,sans-serif}body{padding:24px 18px}.wrap{width:min(1100px,100%);margin:auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:end;margin:5vh 0 28px}.ey,.meta,.btn{font:10px ui-monospace,monospace;letter-spacing:.14em}.ey{color:#696b70}.title{font-size:clamp(34px,7vw,78px);letter-spacing:-.045em;margin:12px 0 4px}.sub{color:#85858a;max-width:600px;font-size:14px;line-height:1.5}.btn{display:inline-block;text-decoration:none;color:#aaa;border:1px solid #27282d;border-radius:99px;padding:11px 14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}.item{background:#0b0c10;border:1px solid #17181d;border-radius:12px;overflow:hidden}.item img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#090a0d}.info{padding:11px}.meta{color:#6f7178;line-height:1.55}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.tag{border:1px solid #292a30;border-radius:99px;padding:4px 7px;color:#8e8f95;font:9px ui-monospace,monospace}.empty{border:1px dashed #26272d;border-radius:14px;padding:38px;color:#686a70;line-height:1.6}.note{margin-top:26px;color:#55575e;font-size:12px;line-height:1.5}</style></head><body><main class="wrap"><div class="top"><div><div class="ey">SPUKLAB / PHONEMA DNA</div><h1 class="title">Archive</h1><div class="sub">Hoja de contactos de hallazgos visuales. Las capturas se conservan en este navegador para comparar composición, profundidad, luz y accidentes.</div></div><a class="btn" href="index.html">LAB →</a></div><section id="grid" class="grid"></section><p class="note">ARCHIVE V0 · almacenamiento local del dispositivo. La siguiente etapa podrá persistir y sincronizar frames y clips.</p></main><script>(()=>{const g=document.getElementById('grid');let db;const req=indexedDB.open('phonema-archive',1);req.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('captures'))d.createObjectStore('captures',{keyPath:'id'})};req.onerror=()=>g.innerHTML='<div class="empty">No fue posible abrir el archivo local.</div>';req.onsuccess=e=>{db=e.target.result;render()};function render(){let q=db.transaction('captures','readonly').objectStore('captures').getAll();q.onsuccess=()=>{let a=q.result.sort((a,b)=>b.id-a.id);if(!a.length){g.innerHTML='<div class="empty">Todavía no hay frames guardados.<br>Entrá a una exploración compatible y usá SAVE FRAME.</div>';return}g.innerHTML='';a.forEach(v=>{let d=document.createElement('article');d.className='item';let im=document.createElement('img');im.src=URL.createObjectURL(v.blob);im.alt='Captura '+v.specimen;let info=document.createElement('div');info.className='info';let date=new Date(v.id).toLocaleString();info.innerHTML='<div class="meta">'+v.specimen+'<br>'+date+'<br>'+v.state+'</div><div class="tags"><span class="tag">FRAME</span><span class="tag">'+(v.tag||'UNSORTED')+'</span></div>';d.append(im,info);g.append(d)})}}})();</script></body></html>
